<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>スキのウラ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: the whole game is the heroine's phone — a bezel on desktop, edge to edge on a real phone. Apps sit behind a bottom tab bar; dates take over the full screen. */
:root{
  --desk:#d9e9f3; --bezel:#17232d;
  --paper:#eef6fb; --card:#fafdff; --ink:#142838; --muted:#5d7385; --line:#d2e3ee; --wash:#e1eff8;
  --bubble:#ffffff; --tabbar:#f6fbfe;
  --rose:#1f7fb8; --on-rose:#ffffff; --wolf:#a3122a; --on-wolf:#ffffff; --wolf-wash:#fbe3e6; --good:#2f7d55; --skip:#5d6b80;
  --c-minato:#4c8760; --c-rei:#7351c0; --c-sakura:#cc4f77; --c-sou:#3d6898; --c-haruto:#a8682c;
  --c-miya:#b07a12; --c-yanagi:#7a5a44; --c-nanase:#4f7186; --c-you:#b8492f; --c-news:#a3122a;
  --f-display:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#060d12; --bezel:#000000;
  --paper:#0e1921; --card:#15232e; --ink:#e5f1f8; --muted:#9ab1c2; --line:#253a49; --wash:#122029;
  --bubble:#1d2f3c; --tabbar:#111e27;
  --rose:#6cc4f0; --on-rose:#06202e; --wolf:#ff7084; --on-wolf:#2a0a10; --wolf-wash:#3a1820; --good:#7fd1a3; --skip:#a9b6c9;
  --c-minato:#8cc59c; --c-rei:#b49cf2; --c-sakura:#f394ad; --c-sou:#90b4de; --c-haruto:#e3a96f;
  --c-miya:#ebc060; --c-yanagi:#c9a68a; --c-nanase:#9cc0d4; --c-you:#f2907a; --c-news:#ff7084;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#060d12; --bezel:#000000;
  --paper:#0e1921; --card:#15232e; --ink:#e5f1f8; --muted:#9ab1c2; --line:#253a49; --wash:#122029;
  --bubble:#1d2f3c; --tabbar:#111e27;
  --rose:#6cc4f0; --on-rose:#06202e; --wolf:#ff7084; --on-wolf:#2a0a10; --wolf-wash:#3a1820; --good:#7fd1a3; --skip:#a9b6c9;
  --c-minato:#8cc59c; --c-rei:#b49cf2; --c-sakura:#f394ad; --c-sou:#90b4de; --c-haruto:#e3a96f;
  --c-miya:#ebc060; --c-yanagi:#c9a68a; --c-nanase:#9cc0d4; --c-you:#f2907a; --c-news:#ff7084;
  color-scheme:dark }

html{height:100%;box-sizing:border-box;background:var(--desk)}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
#app{height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pf{background:color-mix(in srgb,var(--who) 24%,var(--card));border-radius:10px;overflow:hidden;flex:none}
.pf img{width:100%;height:100%}

/* ---- phone frame ---- */
.stage{height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:20px 16px}
.phone{position:relative;width:100%;max-width:400px;height:min(860px,100%);background:var(--paper);border:10px solid var(--bezel);border-radius:46px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px color-mix(in srgb,var(--ink) 18%,transparent)}
@media (max-width:520px){.stage{padding:0}.phone{max-width:none;height:100%;border:0;border-radius:0;box-shadow:none}}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:10px 24px 6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.sbar .bat{letter-spacing:.04em;color:var(--muted)}
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.view.fill{overflow:hidden;display:flex;flex-direction:column}
.pad{padding:8px 18px 24px;display:flex;flex-direction:column;gap:14px}

/* ---- tab bar ---- */
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--tabbar);padding-bottom:max(4px,env(safe-area-inset-bottom,0px))}
.tab{border:0;background:transparent;padding:8px 0 6px;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.tab .ic{font-size:19px;line-height:1.2}
.tab.on{color:var(--rose);font-weight:700}
.dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--wolf);color:var(--on-wolf);font-size:10px;line-height:16px;padding:0 4px;box-sizing:border-box;font-weight:700}

/* ---- shared ---- */
h1.apptitle{font-family:var(--f-display);font-size:24px;margin:0;padding:6px 0 2px}
.muted{color:var(--muted);font-size:13px;margin:0}
.btn-main{background:var(--rose);color:var(--on-rose);border:0;border-radius:999px;padding:12px 22px;font-weight:700}
.btn-main:disabled{opacity:.4;cursor:not-allowed}
.btn-sub{background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 18px}
.btn-sub:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.hearts{font-size:11px;letter-spacing:1px;color:var(--line);white-space:nowrap}
.hearts span{color:var(--who)}
.tagpill{font-size:10.5px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted);white-space:nowrap}
.tagpill.lover{border-color:var(--rose);color:var(--rose)}
.days{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.days i{height:5px;border-radius:3px;background:var(--line)}
.days i.past{background:color-mix(in srgb,var(--rose) 45%,var(--line))}
.days i.now{background:var(--rose)}

/* ---- lock screen (title) ---- */
.lock{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:18px 22px 28px;background:linear-gradient(180deg,color-mix(in srgb,var(--rose) 16%,var(--paper)) 0%,var(--paper) 55%)}
.lock .clock{font-family:var(--f-display);font-size:68px;font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.lock .dateline{text-align:center;color:var(--muted);font-size:13px;margin-top:-6px}
.logo{font-family:var(--f-display);font-weight:700;font-size:50px;line-height:1;margin:14px 0 0;letter-spacing:.02em}
.ura{display:inline-block;transform:scaleX(-1);color:var(--rose)}
.lead{font-family:var(--f-display);font-size:17px;line-height:1.6;margin:0;text-wrap:balance}
.lock .lineup{display:flex;flex-wrap:wrap;gap:6px}
.lock .lineup .pf{width:36px;height:36px;border-radius:50%}
.lock details{font-size:13px}
.lock summary{cursor:pointer;color:var(--muted)}
.rules{display:grid;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:3.6em 1fr;gap:10px;align-items:baseline}
.rules b{font-family:var(--f-display);color:var(--rose);font-size:12px}
.rules span{min-width:0}
.start{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:18px}
.start label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1 1 140px;min-width:0}
.start input{font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}

/* ---- home ---- */
.home .clock{font-family:var(--f-display);font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.home .dateline{color:var(--muted);font-size:13px}
.notes{display:flex;flex-direction:column;gap:8px}
.ntf{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-sizing:border-box}
button.ntf:hover{border-color:var(--rose)}
.ntf .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--wash);font-weight:700;color:var(--muted)}
.ntf .ico.pf{border-radius:50%}
.ntf b{font-size:12px;display:block}
.ntf .tx{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plan b{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;font-weight:500}
.home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.help{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--rose);font-weight:700}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sec-h b{font-size:12px;color:var(--muted);letter-spacing:.08em;font-weight:500}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.pp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);border-radius:14px;background:var(--card);min-width:0}
.pp:hover{border-color:var(--rose)}
.pp .pf{width:42px;height:42px;border-radius:50%}
.pp .nm{font-size:12.5px;font-weight:700;line-height:1.3}
.pp .st{font-size:10.5px;color:var(--muted);line-height:1.3;text-align:center}
.pp .st.warn{color:var(--wolf);font-weight:700}
.pp .st.new{color:var(--rose);font-weight:700}
.pfbtn{border:0;background:transparent;padding:0;border-radius:50%;flex:none;display:block}

/* ---- overlays (guide, profile) ---- */
.sheet-wrap{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;background:color-mix(in srgb,var(--ink) 45%,transparent)}
.sheet{width:100%;box-sizing:border-box;max-height:90%;overflow-y:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet.guide h2{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.3}
.sheet.guide p{margin:0;font-size:14px}
.sheet .kicker{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.gdots{display:flex;justify-content:center;gap:6px;padding-top:4px}
.gdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.gdots i.on{background:var(--rose)}
.gbtns{justify-content:flex-end}
.sheet.prof .pcard{max-width:none;box-shadow:none}
.sheet.prof .photo{aspect-ratio:16/10}
.sheet.prof .photo img{width:auto;height:90%}
.rec{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.rec dt{font-size:11px;color:var(--muted)}
.rec dd{margin:0;font-weight:700;font-size:14px}

/* ---- talk list / lumi list ---- */
.lrow{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;box-sizing:border-box}
.lrow .pf{width:46px;height:46px;border-radius:50%}
.lrow .mid{min-width:0;display:flex;flex-direction:column;line-height:1.45}
.lrow .nm{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lrow .pv{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{min-width:20px;height:20px;border-radius:10px;background:var(--rose);color:var(--on-rose);font-size:11px;line-height:20px;text-align:center;padding:0 6px;box-sizing:border-box;font-weight:700}

/* ---- thread ---- */
.th-h{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px 8px;border-bottom:1px solid var(--line);background:var(--tabbar)}
.th-h .pf{width:36px;height:36px;border-radius:50%}
.th-h .who{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.th-h .who b{font-size:15px}
.back{border:0;background:transparent;font-size:24px;line-height:1;color:var(--rose);padding:2px 6px}
.th-body{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--wash)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg .pf{width:28px;height:28px;border-radius:50%}
.msg .b{background:var(--bubble);border-radius:18px 18px 18px 6px;padding:8px 12px;font-size:14px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.msg.me{align-self:flex-end}
.msg.me .b{background:var(--rose);color:var(--on-rose);border-radius:18px 18px 6px 18px}
.mnar{align-self:center;max-width:90%;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.stamp{align-self:center;font-size:11px;color:var(--muted);background:var(--paper);border-radius:999px;padding:1px 12px}
.th-opts{flex:none;border-top:1px solid var(--line);background:var(--tabbar);padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-height:44%;overflow-y:auto}
.opt{text-align:left;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:14px}
.opt:hover:not(:disabled){border-color:var(--rose)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt small{color:var(--muted);font-size:11px;white-space:nowrap}
.th-hint{font-size:12px;color:var(--muted);text-align:center;margin:0}

/* ---- story (dates, prologue) ---- */
.story{flex:1;min-height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,color-mix(in srgb,var(--rose) 9%,var(--paper)),var(--paper))}
.story-h{flex:none;padding:6px 18px 4px;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:12px}
.story-log{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 14px;cursor:pointer}
.ln{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start}
.ln.new{animation:rise .35s ease both}
.ln.old{opacity:.7}
.ln .who{display:flex;flex-direction:column;align-items:center;gap:2px}
.ln .who .pf{width:44px;height:44px}
.ln .who b{font-size:11px;color:var(--who);white-space:nowrap}
.ln .say{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:8px 14px}
.ln.nar,.ln.me,.ln.news{grid-template-columns:1fr}
.ln.nar .say{background:var(--wash);border:0;border-radius:10px;padding:10px 16px}
.ln.me{justify-items:end}
.ln.me .say{background:var(--rose);color:var(--on-rose);border:0;border-radius:16px 4px 16px 16px;max-width:85%;font-weight:500}
.ln.news .say{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--wolf);border-radius:10px;font-size:13.5px}
.ln.news .say small{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--wolf);font-weight:700}
.foot{flex:none;padding:10px 14px 14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;max-height:46%;overflow-y:auto}
.choice{text-align:left;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;justify-content:space-between;gap:12px;align-items:center}
.choice:hover:not(:disabled){border-color:var(--rose)}
.choice small{color:var(--muted);font-size:11px;white-space:nowrap}
.adv{display:flex;justify-content:space-between;align-items:center;gap:8px}
.next{border:0;background:transparent;color:var(--rose);font-weight:700;padding:6px 2px;display:flex;gap:8px;align-items:center}
.next .tri{display:inline-block;animation:bob 1s ease-in-out infinite}
.skip{font-size:12px;color:var(--muted);background:transparent;border:0;text-decoration:underline;padding:6px 2px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(3px)}}

/* ---- swipe ---- */
.deck{display:flex;justify-content:center}
.pcard{position:relative;width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:0 10px 26px color-mix(in srgb,var(--ink) 10%,transparent);transition:transform .2s ease}
.photo{position:relative;aspect-ratio:1/1;max-width:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--who) 30%,var(--card)),color-mix(in srgb,var(--who) 55%,var(--card)));display:flex;align-items:flex-end;justify-content:center}
.photo img{width:80%;height:80%}
.badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;background:var(--card);color:var(--ink);border-radius:999px;padding:2px 10px}
.badge.friend{background:var(--ink);color:var(--card)}
.pinfo{padding:12px 16px 16px;display:flex;flex-direction:column;gap:4px}
.pinfo h2{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.2}
.pinfo h2 small{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:400;margin-left:6px}
.pinfo .job{margin:0;font-size:12px;color:var(--muted)}
.pinfo .bio{margin:0;font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--muted)}
.stamp-s{position:absolute;top:22px;font-family:var(--f-display);font-weight:700;font-size:26px;padding:2px 12px;border:3px solid;border-radius:10px;pointer-events:none}
.stamp-s.yes{left:18px;color:var(--rose);transform:rotate(-12deg);opacity:var(--yes,0)}
.stamp-s.no{right:18px;color:var(--skip);transform:rotate(12deg);opacity:var(--no,0)}
.swbtns{display:flex;justify-content:center;gap:28px}
.sw{width:60px;height:60px;border-radius:50%;border:2px solid;background:var(--card);font-size:24px;line-height:1;display:grid;place-items:center}
.sw.no{color:var(--skip)}
.sw.yes{color:var(--rose)}
.center{text-align:center}

/* ---- memo / bank ---- */
.note details{border-top:1px solid var(--line);padding:8px 0}
.note summary{cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center}
.note summary .sdot{width:10px;height:10px;border-radius:50%;background:var(--who)}
.note summary .count{font-weight:400;color:var(--muted);font-size:12px}
.note ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.note li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px}
.note li em{font-style:normal;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;height:fit-content;white-space:nowrap}
.note li span{min-width:0}
.motif{border-left:4px solid var(--wolf)}
.bal{font-family:var(--f-display);font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.txl{margin:0;padding:0;list-style:none}
.txl li{display:grid;grid-template-columns:3.4em 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.txl .d{color:var(--muted)}
.txl .plus{color:var(--good);font-weight:700}

/* ---- endings ---- */
.end{display:flex;flex-direction:column;gap:16px}
.end .kicker{font-size:11px;letter-spacing:.18em;color:var(--muted)}
.end h1{font-family:var(--f-display);font-size:30px;line-height:1.25;margin:0;text-wrap:balance}
.end.over h1{color:var(--wolf)}
.reveal{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;background:var(--wash)}
.reveal h3{margin:0;font-size:13px;letter-spacing:.06em}
.reveal p{margin:0;font-size:14px}
.wolfmark{color:var(--wolf);font-weight:700}
.okmark{color:var(--good);font-weight:700}
.wolves{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.wolves li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;font-size:14px;line-height:1.5}
.wolves .pf{width:40px;height:40px;border-radius:50%}

function registerCast() {

    if (c.confess && !CONFESS[id]) CONFESS[id] = c.confess;
    if (c.colors) { light += `--c-${id}:${c.colors.light};`; dark += `--c-${id}:${c.colors.dark};`; }

  st.textContent = `:root{${light}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}}:root[data-theme="dark"]{${dark}}`;
  document.head.appendChild(st);
}

function freeDays(lo, hi) { const r = []; for (let d = lo; d <= hi; d++) if (!S.schedule[d]) r.push(d); return r; }
function pickDay(lo, hi) {
  if (lo > LAST_DAY) return null;
  let c = freeDays(lo, Math.min(hi, LAST_DAY));
  if (!c.length) c = freeDays(lo, LAST_DAY).slice(0, 1);
  return c.length ? shuffle(c)[0] : null;
}
function match(id, how) {
  S.matched.push(id);
  S.chars[id].since = S.day;
  const sd = pickDay(S.day + 2, S.day + 4);
  if (sd) S.schedule[sd] = { id, kind: 'small' };
  const bd = pickDay(Math.max(12, S.day + 5, (sd || 0) + 1), C[id].bigBy || 18);
  if (bd) S.schedule[bd] = { id, kind: 'big' };
  post(id, 'nar', how || `Lumi で${C[id].short}とマッチしました`);
}

// Wolves are dealt after the first likes, so a small start (2–3 people) still holds at least one of them.
function dealWolves() {
  const mine = shuffle(S.matched), rest = shuffle(IDS.filter(id => !S.matched.includes(id)));
  const k = mine.length >= 2 ? (Math.random() < 0.35 ? 2 : 1) : Math.random() < 0.5 ? 1 : 0;
  S.wolves = [...mine.slice(0, k), ...rest.slice(0, WOLF_COUNT - k)];
}

/* ---------- actions ---------- */
const ACT = {
  openSwipe(mode) {
    S.swipe = { mode, deck: mode === 'start' ? shuffle(deckIds()) : pool(), pos: 0, added: [] };
    S.view = 'swipe'; render();
  },

  swipe(yes) {
    const sw = S.swipe, id = sw.deck[sw.pos];
    if (yes) { match(id); sw.added.push(id); }
    sw.pos++;
    const full = sw.mode === 'start' ? S.matched.length >= MAX_START : S.matched.length >= MAX_TOTAL;
    if (full || sw.pos >= sw.deck.length) {
      if (sw.mode === 'start' && !S.matched.length) { sw.deck = shuffle(deckIds()); sw.pos = 0; sw.retry = true; render(); return; }
      ACT.closeSwipe();
      return;
    }
    render();
  },

  closeSwipe() {
    const sw = S.swipe;
    S.swipe = null;
    if (sw.mode === 'start') {
      dealWolves();
      post('miya', 'them', 'マッチおめでと！　デートするなら、駅前の「喫茶かもめ」がおすすめ。マスターの柳さん、人を見る目だけは確かだから');
      post('miya', 'them', 'あやしいと思ったら、すぐここに相談してね。……ユキみたいには、なってほしくないから');
      post('kamome', 'them', 'いらっしゃいませ、喫茶かもめです。デートのご利用、お待ちしております。気になることがあれば、こちらにどうぞ。——柳');
      S.story = null; S.guide = 0;
      ACT.morning();
    } else {
      if (sw.added.length) notify('lumi', 'Lumi', `${sw.added.map(i => C[i].short).join('、')}とマッチしました`);
      S.view = 'lumi'; render();
    }
  },

  morning() {
    S.notes = []; S.plan = null;
    notify('diary', `${S.day}日目のひとこと`, DAY_FLAVOR[S.day - 1]);
    S.repay = S.repay.filter(r => {
      if (r.day !== S.day) return true;
      tx(r.amount, `${C[r.id].short}から返金`); addAff(r.id, 3); postLines(r.id, r.lines);
      notify('bank', '銀行', `${C[r.id].short}から${yen(r.amount)}が振り込まれました`);
      return false;
    });
    if (S.day === PAYDAY) { tx(50000, '給与'); notify('bank', '銀行', `お給料 ${yen(50000)} が振り込まれました`); }
    else if (S.day >= 2 && Math.random() < 0.25) {
      const [amt, text] = pick1(LIFE_EVENTS);
      const real = amt < 0 ? -Math.min(-amt, S.money) : amt;
      tx(real, text.split('。')[0]);
      notify('bank', '銀行', `${text}（${real < 0 ? '−' : '+'}${yen(Math.abs(real))}）`);
    }
    // ノア: a wrong-number message arrives once, if there is room for one more match.
    if (S.day === S.wrongDay && !S.matched.includes('noa') && S.matched.length < MAX_TOTAL) {
      const th = thread('noa'); th.wrong = true;
      post('noa', 'them', 'ユウタさん、あしたの会議の資料、送りました。確認してください');
      post('noa', 'them', '……すいません！　番号をまちがえました。日本語の連絡先、まだ慣れていなくて');
      notify('talk', '知らない番号', 'すいません！　番号をまちがえました。', 'noa');
    }
    if (S.day === C.noa.returnDay && S.matched.includes('noa')) {
      if (v('noa') === 'true') {
        S.chars.noa.home = true;
        post('noa', 'them', '{n}さん、いま羽田に着きました！　……今日、会えますか？');
        notify('talk', 'ノア', 'いま羽田に着きました！　……今日、会えますか？', 'noa');
      } else {
        post('noa', 'them', '{n}さん、ごめんなさい。帰国が、延期になりました。……くわしいことは、また連絡します');
        notify('talk', 'ノア', 'ごめんなさい。帰国が、延期になりました', 'noa');
      }
    }
    const ev = S.schedule[S.day];
    if (ev && S.matched.includes(ev.id)) {
      const R = C[ev.id].req[ev.kind];
      postLines(ev.id, R.ask);
      if (S.partner === ev.id) post(ev.id, 'nar', `恋人の${C[ev.id].short}からのお願い。断ったら、きっとすごく悲しませてしまう`);
      thread(ev.id).pending = { kind: ev.kind, asked: false };
      notify('talk', C[ev.id].short, R.ask[R.ask.length - 1][1], ev.id);
    }
    const free = shuffle(S.matched.filter(id => !thread(id).pending));
    const invited = free.slice(0, Math.random() < 0.5 ? 2 : 1);
    invited.forEach(id => {
      const t = isRemote(id) ? '今夜、少しだけ電話できますか？' : pick1(INVITES);
      post(id, 'them', t); notify('talk', C[id].short, t, id);
    });
    // Quiet people never ping first, so remind the player about whoever has been left alone longest.
    const lonely = free.filter(id => !invited.includes(id) && quietDays(id) >= QUIET + 1).sort((a, b) => quietDays(b) - quietDays(a))[0];
    if (lonely) notify('lumi', 'Lumi', `${C[lonely].short}と${quietDays(lonely)}日会っていません。自分からは誘ってこない人もいます`, lonely);
    S.view = 'home'; render();
  },

  sleep() {
    if (S.matched.some(id => thread(id).pending)) return;
    if (S.day >= LAST_DAY) { ACT.finale(); return; }
    S.day++; ACT.morning();
  },

  /* requests arrive in chat */
  reqDetail(id) {
    const p = thread(id).pending, lines = C[id].req[p.kind].detail[v(id)];
    post(id, 'me', 'もう少し詳しく聞かせてもらえる？');
    addAff(id, -3); p.asked = true;
    postLines(id, lines);
    clue(id, p.kind === 'big' ? '大きなお願い' : 'お願い', lines.map(l => l[1]).join(' '));
    render();
  },

  // Wolves react with the same heart changes as sincere people, so the numbers never give them away.
  reqAnswer({ id, yes }) {
    const th = thread(id), { kind, asked } = th.pending, R = C[id].req[kind], k = v(id), ch = S.chars[id];
    th.pending = null;
    post(id, 'me', yes ? (asked ? 'わかった、引き受けるよ' : 'うん、いいよ') : (asked ? 'ごめん、やっぱりできない' : 'ごめん、それはできない'));
    if (kind === 'big') ch.bigDone = true;
    let lines, d;
    if (yes) {
      if (kind === 'big' && k === 'wolf') { S.overBy = id; S.view = 'over'; render(); return; }
      const cost = R.cost[k] || 0;
      if (cost > S.money) {
        lines = [['nar', `手持ちが${yen(S.money)}しかなくて、${yen(cost)}を用意できなかった`]]; d = -3;
      } else {
        if (cost) tx(-cost, `${C[id].short}へ`);
        lines = [...R.accept[k]]; d = R.gain.true;
        if (!asked) { d += 5; lines.push(['nar', `何も聞かずに信じてくれたことが、${C[id].short}にはうれしかったみたいだ`]); }
        if (k === 'wolf') ch.hooked = true;
        if (R.sets) ch[R.sets] = true;
        if (R.repay && R.repay[k]) S.repay.push({ day: S.day + 3, id, amount: R.repay[k].amount, lines: R.repay[k].lines });
      }
    } else {
      lines = [...R.refuse[k]]; d = R.loss.true * (S.partner === id ? 2 : 1);
      if (kind === 'big' && k === 'wolf' && ch.aff + d >= 70) lines.push(...C[id].waver);
    }
    addAff(id, d);
    postLines(id, lines);
    render();
  },

  wrongReply(yes) {
    const th = thread('noa'); th.wrong = false;
    if (!yes) { post('noa', 'nar', '返信はしなかった'); render(); return; }
    post('noa', 'me', '番号、まちがってますよ。お仕事おつかれさまです');
    post('noa', 'them', 'ご親切に、ありがとうございます！　日本の人は、やさしいですね');
    post('noa', 'them', 'ぼくは、ノアといいます。シンガポールで働いています。……もしよかったら、ときどき、日本語の練習相手になってくれませんか？');
    match('noa', '間違いメッセージから、ノアと話すようになった');
    clue('noa', 'はじまり', 'Lumi ではなく、知らない番号からの間違いメッセージで知り合った。シンガポール在住だという');
    render();
  },

  /* the day's plan: a date */
  date(id) {
    const ch = S.chars[id], cost = dateCost(id);
    S.plan = { type: 'date', id };
    const remote = isRemote(id);
    if (cost) tx(-cost, `${C[id].short}とデート`);
    post(id, 'me', remote ? '今夜、少し話せる？' : '今日、会えるかな？');
    ch.dates++; ch.lastDate = S.day;
    if (C[id].twin) {
      const yo = ch.dates > 1 && Math.random() < (v(id) === 'wolf' ? 0.5 : 0.3);
      S.twinNow = yo ? 'yo' : 'yu';
      const free = [0, 1, 2].find(i => !ch.used.includes(i));
      const k = free === undefined ? 3 : free;
      if (free !== undefined) ch.used.push(free);
      const T = C[id].talks[k];
      const lines = [['nar', `待ち合わせ場所に、${C[id].short}くんの姿が見えた`], ...T.t[S.twinNow]];
      if (k === 1 && !yo && !S.knowTwin) {
        S.knowTwin = true;
        clue(id, 'デート', '七瀬くんには、ヨウという双子の弟がいる。昔からよく間違えられるらしい');
      }
      const choices = T.c.map((c, ci) => ({ label: c[0], me: c[0], act: 'talkAns', arg: { id, idx: k, ci } }));
      if (S.knowTwin) choices.push({ label: '……もしかして、ヨウくん？', me: '……ねえ。もしかして、ヨウくん？', act: 'accuse', arg: id, note: '見破る' });
      scene(`デート　${C[id].short}`, lines, [...choices, ...confrontChoice(id)], true);
      return;
    }
    if (C[id].remote && !remote && !ch.met) {
      // First time actually meeting someone who was only ever a voice on the phone.
      ch.met = true;
      const T = C[id].talks[3];
      scene(`デート　${C[id].short}`, T.t, [...T.c.map((c, ci) => ({ label: c[0], me: c[0], act: 'talkAns', arg: { id, idx: 3, ci } })), ...confrontChoice(id)], true);
      return;
    }
    const tag = `${remote ? '通話' : 'デート'}　${C[id].short}`;
    const meet = ['nar', remote ? `夜、${C[id].short}に電話をかけた` : `待ち合わせ場所に、${C[id].short}の姿が見えた`];
    const idx = [0, 1, 2].find(i => !ch.used.includes(i));
    if (idx === undefined) {
      scene(tag, [meet], [{ label: remote ? 'とりとめなく話す' : 'のんびり過ごす', act: 'talkAns', arg: { id, idx: -1 } }, ...confrontChoice(id)], true);
      return;
    }
    ch.used.push(idx);
    const T = C[id].talks[idx];
    const tl = Array.isArray(T.t) ? T.t : T.t[v(id)];
    scene(tag, remote ? tl : [meet, ...tl], [...T.c.map((c, ci) => ({ label: c[0], me: c[0], act: 'talkAns', arg: { id, idx, ci } })), ...confrontChoice(id)], true);
  },

  talkAns({ id, idx, ci }) {
    const ch = S.chars[id];
    let lines, d;
    if (idx === -1) { lines = [['nar', `${C[id].short}と、${isRemote(id) ? '夜遅くまで電話で話した' : 'のんびりした時間を過ごした'}`]]; d = 5; }
    else if (C[id].twin) {
      const c = C[id].talks[idx].c[ci], yo = S.twinNow === 'yo';
      lines = [...(yo ? c[4] : c[2])]; d = yo ? c[3] : c[1];
    }
    else { const c = C[id].talks[idx].c[ci]; lines = [...c[2]]; d = c[1]; }
    if (S.outfit > 0 && !isRemote(id)) { S.outfit--; d += 3; lines.push(['nar', `${C[id].short}が、新しい服をほめてくれた`]); }
    if (S.gift && !isRemote(id)) { S.gift = false; d += 6; lines.push(['nar', `${C[id].short}にプレゼントを渡すと、とても喜んでくれた`]); }
    addAff(id, d);
    const tp = C[id].twin ? C[id].tells[S.twinNow === 'yo' && v(id) === 'wolf' ? 'wolf' : 'true'] : C[id].tells[v(id)];
    if (ch.tell < tp.length && Math.random() < 0.6) {
      const t = tp[ch.tell++];
      lines.push(['nar', '別れぎわ、ふと思い出したように——'], [id, t]);
      clue(id, 'デート', t);
    }
    const liar = v(id) === 'wolf' && (!C[id].twin || S.twinNow === 'yo');
    if (!isRemote(id) && Math.random() < (liar ? 0.5 : 0.4)) {
      const t = (liar ? MOTIFS[S.motif].scene : DECOYS[S.decoy[id]]).split('{c}').join(C[id].short);
      lines.push(['nar', t]);
      clue(id, '持ち物', t);
    }
    if (CONFESS[id] && !S.partner && !ch.confessed && ch.aff >= 90) {
      ch.confessed = true;
      lines.push(['nar', '帰り道。ふいに、足が止まった'], ...CONFESS[id].ask);
      scene(S.story.tag, lines, [
        { label: '付き合う', me: 'うん。……よろしくお願いします', act: 'confessAns', arg: { id, yes: true } },
        { label: 'ごめん、まだ友達でいたい', me: 'ごめんね。……まだ、友達でいたいな', act: 'confessAns', arg: { id, yes: false } },
      ]);
      return;
    }
    scene(S.story.tag, lines, homeChoice(id));
  },

  confessAns({ id, yes }) {
    let lines;
    if (yes) {
      S.partner = id; addAff(id, 5);
      lines = [...CONFESS[id].yes, ['nar', `${C[id].short}と付き合うことになった`]];
      clue(id, 'デート', `${C[id].short}に告白されて、付き合うことにした`);
    } else {
      addAff(id, -8);
      lines = [...CONFESS[id].no];
    }
    scene(S.story.tag, lines, homeChoice(id));
  },

  accuse(id) {
    let lines;
    if (S.twinNow === 'yo') {
      S.twinCaught++; addAff(id, 8);
      lines = [...C[id].caught[v(id)]];
      clue(id, 'デート', 'この日デートに来ていたのは、ユウではなく双子の弟のヨウだった');
    } else {
      addAff(id, -6); lines = [...C[id].wrong];
    }
    scene(S.story.tag, lines, homeChoice(id));
  },

  confront(id) {
    const ch = S.chars[id], L = C[id].lie;
    ch.confronted = true;
    let lines;
    if (v(id) === 'wolf' && C[id].twin && S.twinNow !== 'yo') {
      // The real ユウ knows nothing; the player can try again on a day ヨウ shows up.
      ch.confronted = false; S.knowTwin = true;
      lines = [...L.confront.wolf_yu];
      clue(id, '問い詰めた', 'ユウには心当たりがないようだった。食い違いの相手は、別の誰か……？');
    } else if (v(id) === 'wolf') {
      ch.exposed = true;
      lines = [...L.confront.wolf];
      clue(id, '問い詰めた', '問い詰めると、言い訳がしどろもどろになった');
      if (!S.motifKnown) {
        S.motifKnown = true;
        const m = MOTIFS[S.motif].item;
        post('miya', 'me', `今日、${C[id].short}に前の話を聞いてみたんだけど……なんか、すごく動揺してた`);
        post('miya', 'them', `……それ、ヤバいやつかも。最近アプリで出てる詐欺グループ、仲間うちで「${m}」を目印にしてるらしいよ。ユキをだましたやつも、持ってたって`);
        post('miya', 'them', '同じのを持ってる人、ほかにもいなかった？　メモ、見返してみなよ');
        clue(id, 'ミヤの話', `詐欺グループの目印は「${m}」らしい`);
      }
    } else {
      addAff(id, -4);
      lines = [...L.confront.true];
      clue(id, '問い詰めた', '話を聞くと、ちゃんとした理由があった');
    }
    scene(S.story.tag, lines, homeChoice(id));
  },

  goHome(id) {
    const ch = S.chars[id];
    const msgs = C[id].twin && S.twinNow === 'yo' ? AFTER.you : AFTER[id];
    S.story = null; S.view = 'thread'; S.open = id;
    post(id, 'them', msgs[(ch.dates - 1) % 3]);
    if (C[id].lie && !ch.claim) {
      ch.claim = true;
      postLines(id, C[id].lie.claim);
      clue(id, '本人の話', C[id].lie.claim.map(l => l[1]).join(' '));
    }
    thread(id).unread = 0;
    render();
  },

  /* the day's plan: asking around */
  sns(id) {
    S.plan = { type: 'sns', id };
    const ch = S.chars[id], L = C[id].lie;
    breakSecret(id);
    post('miya', 'me', `${C[id].short}のこと、調べてもらえる？`);
    post('miya', 'them', 'オッケー、ちょっと待ってね……');
    if (L && ch.claim && !ch.evidence) {
      ch.evidence = true;
      const ev = L.evidence[v(id)];
      post('miya', 'them', ev);
      post('miya', 'them', 'これ、この前本人が言ってた話と違くない？　今度会ったとき、聞いてみたら？');
      clue(id, 'ミヤのSNS調査', ev);
    } else {
      const text = C[id].sns[v(id)][ch.sns++];
      if (C[id].twin) S.knowTwin = true;
      post('miya', 'them', text);
      clue(id, 'ミヤのSNS調査', text);
    }
    render();
  },

  obs(id) {
    S.plan = { type: 'obs', id };
    breakSecret(id);
    post('kamome', 'me', `${C[id].short}さんのこと、何か覚えていますか？`);
    const text = C[id].obs[v(id)][S.chars[id].obs++];
    if (C[id].twin) S.knowTwin = true;
    post('kamome', 'them', text);
    clue(id, '柳さんの話', text);
    render();
  },

  /* shopping */
  buy(item) {
    S.shopped = S.day;
    let text;
    if (item === 'outfit') { tx(-8000, '服'); S.outfit = 3; text = '春らしい色の服を買った。次のデートが楽しみになった'; }
    else if (item === 'gift') { tx(-3000, 'プレゼント'); S.gift = true; text = '小さな紙袋に入ったプレゼントを買った。次に会う人に渡そう'; }
    else {
      tx(-300, '宝くじ');
      const r = Math.random();
      const win = r < 0.01 ? 100000 : r < 0.06 ? 10000 : r < 0.26 ? 300 : 0;
      if (win) tx(win, '宝くじ当せん');
      text = win === 100000 ? '宝くじが1等！　手がふるえて、何度も数字を確かめた' : win === 10000 ? '宝くじで3等が当たった！' : win === 300 ? '宝くじは末等。300円が戻ってきた' : '宝くじは、はずれだった';
    }
    notify('shop', '駅ビル', text);
    S.view = 'home'; render();
  },

  /* finale */
  finale() {
    S.finale = true; S.picks = []; S.plan = { type: 'end' };
    post('miya', 'them', '20日間、おつかれ。……ねえ、{n}');
    post('miya', 'them', 'マッチした人のなかで、嘘をついてたのは誰だったと思う？　何人選んでもいいよ');
    S.view = 'thread'; S.open = 'miya'; thread('miya').unread = 0;
    render();
  },
  pick(id) { const i = S.picks.indexOf(id); if (i < 0) S.picks.push(id); else S.picks.splice(i, 1); render(); },
  guess() {
    S.guess = S.picks.slice();
    post('miya', 'me', S.guess.length ? `${S.guess.map(i => C[i].short).join('、')}……だと思う` : 'マッチした中には、いなかったと思う');
    S.view = 'end'; render();
  },

  /* navigation */
  tab(view) { S.view = view; S.open = null; S.profile = null; if (view === 'memo') S.newClues = 0; render(); },
  openThread(tid) { S.profile = null; S.view = 'thread'; S.open = tid; thread(tid).unread = 0; render(); },
  profile(id) { S.profile = id; render(); },
  closeProfile() { S.profile = null; render(); },
  guide(step) { S.guide = step === 'close' || +step >= GUIDE.length ? null : +step; render(); },
  shop() { S.view = 'shop'; render(); },
  restart() { const n = S ? S.name : ''; newGame(n); },
  toTitle() { S = null; render(); },
};

/* ---------- endings ---------- */
function guessOptions() {
  return [
    ...S.matched.map(id => ({ label: `${S.picks.includes(id) ? '☑' : '☐'}　${C[id].full}`, act: 'pick', arg: id })),
    { label: S.picks.length ? `この${S.picks.length}人だと答える` : 'マッチした中には、いなかったと答える', act: 'guess' },
  ];
}

function ending() {
  const metWolves = S.wolves.filter(id => S.matched.includes(id));
  const isConverted = id => { const c = S.chars[id]; return c.bigDone && c.aff >= (c.hooked ? 90 : 80) && (!C[id].twin || S.twinCaught > 0); };
  const converted = metWolves.filter(isConverted);
  const best = S.matched.filter(id => !S.wolves.includes(id)).sort((a, b) => S.chars[b].aff - S.chars[a].aff)[0];
  const ba = best ? S.chars[best].aff : 0;
  let title, lines, kicker;
  if (converted.length) { kicker = 'TRUE END'; title = 'ほんとの好き'; lines = converted.flatMap(id => C[id].convert); }
  else if (S.partner && !S.wolves.includes(S.partner)) {
    const p = S.partner;
    kicker = 'GOOD END'; title = C[p].love.title; lines = C[p].love.lines;
    if (C[p].twin && S.twinCaught > 0) lines = [...lines, ['you', '兄貴のこと、頼んだからな！']];
  }
  else if (S.partner) {
    const p = S.partner;
    kicker = 'BAD END'; title = '偽りの恋人エンド';
    lines = [['nar', `20日目の夜、${C[p].short}からの返信は来なかった`], ['nar', '「付き合おう」と言ってくれたあの日の笑顔は、なんだったんだろう']];
  }
  else if (ba >= 90 && C[best].mode === '友達') { kicker = 'GOOD END'; title = C[best].love.title; lines = C[best].love.lines; }
  else if (ba >= 65) { kicker = 'NORMAL END'; title = `親友エンド　${C[best].full}`; lines = C[best].friend; }
  else { kicker = 'LONELY END'; title = 'ひとりぼっちエンド'; lines = [['nar', '疑いすぎたのかもしれない。誰にもだまされなかったけれど、誰とも近づけなかった'], ['nar', 'アプリの通知は、今夜も鳴らない']]; }
  return { metWolves, converted, title, lines, kicker };
}

const relTag = id => (S.partner === id ? '<span class="tagpill lover">恋人</span>' : C[id].mode === '友達' ? '<span class="tagpill">友達</span>' : '')

function lineHTML([w, t, kind], cls = '') {
  const say = esc(fmt(t));
  if (w === 'news') return `<div class="ln news ${cls}"><div class="say"><small>NEWS　速報</small>${say}</div></div>`;
  if (w === 'nar' || w === 'me') return `<div class="ln ${w} ${cls}"><div class="say">${say}</div></div>`;
  return `<div class="ln ${cls}" ${who(w)}><div class="who">${pfHTML(w)}<b>${esc(SPK[w])}</b></div><div class="say">${say}</div></div>`;
}
const linesHTML = lines => lines.map(l => lineHTML(l)).join('');

function wolfListHTML(fate) {

  const met = S.wolves.filter(id => S.matched.includes(id));

function tallyHTML() {
  return `<ul class="tally">${S.matched.map(id => `<li ${who(id)}><span>${C[id].short}</span><span class="meter"><b style="width:${S.chars[id].aff}%"></b></span><span class="v">${S.chars[id].aff}</span></li>`).join('')}</ul>`;
}

function threadOptions(tid) {
  if (S.finale) return tid === 'miya' ? guessOptions() : [];
  if (C[tid] && thread(tid).wrong) return [
    { label: '返信する', act: 'wrongReply', arg: true, note: '番号ちがいを教える' },
    { label: 'そのままにする', act: 'wrongReply', arg: false },
  ];
  if (C[tid] && !S.matched.includes(tid)) return [];
  if (C[tid]) {
    const p = thread(tid).pending;
    if (p) return [
      { label: '引き受ける', act: 'reqAnswer', arg: { id: tid, yes: true } },
      { label: '断る', act: 'reqAnswer', arg: { id: tid, yes: false } },
      ...(p.asked ? [] : [{ label: '詳しく聞く', act: 'reqDetail', arg: tid }]),
    ];
    if (S.plan) return [];
    const cost = dateCost(tid);
    if (isRemote(tid)) return [{ label: '電話する', act: 'date', arg: tid, note: '今日の予定にする・海外にいるので会えない' }];
    return [{ label: '会いに行く', act: 'date', arg: tid, disabled: cost > S.money, note: cost > S.money ? 'お金が足りない' : `今日の予定にする・${yen(cost)}` }];
  }
  if (S.plan) return [];
  if (tid === 'miya') return S.matched.map(id => {
    const ch = S.chars[id], pend = C[id].lie && ch.claim && !ch.evidence;
    return { label: `${C[id].short}のことを調べてもらう`, act: 'sns', arg: id, disabled: ch.sns >= 3 && !pend, note: ch.secret && !(ch.sns >= 3 && !pend) ? '秘密の約束をやぶる' : pend ? '本人の話の裏を取る' : ch.sns >= 3 ? 'もう調べつくした' : `${ch.sns}/3回` };
  });
  return S.matched.map(id => {
    const ch = S.chars[id];
    return { label: `${C[id].short}のことを聞く`, act: 'obs', arg: id, disabled: !ch.dates || ch.obs >= 2, note: !ch.dates ? 'まだ一緒に来ていない' : ch.obs >= 2 ? 'もう聞けることはない' : ch.secret ? '秘密の約束をやぶる' : `${ch.obs}/2回` };
  });
}

  const hint = S.finale ? '' : S.plan && !(C[tid] && thread(tid).pending) ? '<p class="th-hint">予定は1日に1つまで。今日はもう埋まっています。ホームの「おやすみ」で次の日へ</p>' : '';

}

function endHTML() {
  const e = ending();
  const hit = S.guess.filter(id => S.wolves.includes(id));
  const falsePicks = S.guess.filter(id => !S.wolves.includes(id));
  const missed = e.metWolves.filter(id => !S.guess.includes(id));
  const answer = S.guess.length ? S.guess.map(id => C[id].full).join('、') : '嘘つきはいなかった';
  const tail = [missed.length ? `見逃した狼が${missed.length}人` : '', falsePicks.length ? `本当は狼ではなかった人が${falsePicks.length}人` : ''].filter(Boolean).join('、');
  const guessLine = `あなたの答えは「${esc(answer)}」。` + (!falsePicks.length && !missed.length ? '<span class="okmark">全問正解です。</span>' : `当たりは${hit.length}人。${tail}いました。`);
  const fate = id => e.converted.includes(id) ? 'あなたのおかげで、狼をやめた' : esc(C[id].fate);
  return `<div class="pad end">
    <div class="kicker">${e.kicker}</div><h1>${esc(e.title)}</h1>
    <div class="endlines lines">${linesHTML(e.lines)}</div>
    <div class="reveal"><h3>答え合わせ</h3><p>${guessLine}</p>${wolfListHTML(fate)}

    <div class="reveal"><h3>好感度</h3>${tallyHTML()}</div>
    <div class="row"><button class="btn-main" data-act="restart">もう一度あそぶ</button><button class="btn-sub" data-act="toTitle">タイトルへ</button></div>
  </div>`;
}

/* ---------- overlays: how-to guide, profile sheet ---------- */
const GUIDE = [
  ['1日の流れ', ['朝、スマホに通知が届きます。', 'その日の予定を1つ決めて、ホームの「おやすみ」で次の日へ進みます。', `全部で${LAST_DAY}日間です。`]],
  ['予定は1日に1つだけ', ['次のどれか1つを選ぶと、その日の予定は埋まります。', '・トークから「会いに行く」（デート）', '・ミヤに SNS を調べてもらう', '・喫茶かもめで、柳さんに話を聞く', 'だれと会うか、毎日えらぶのがこのゲームです。']],
  ['予定とは別にできること', ['・届いたお願いに返事をする（返事をしないと眠れません）', '・駅ビルで買い物（1日1回）', `・Lumi で新しい人をさがす（${ADD_UNTIL}日目まで）`]],
  ['自分から連絡してこない人もいる', ['毎朝誘ってくれるのは、マッチした人のうち1〜2人だけです。', 'ホームの「マッチ中のみんな」で、しばらく会っていない人に印がつきます。', '通知が来なくても、トークから会いに行けます。']],
  ['相手のことを知る', ['アイコンをタップすると、Lumi のプロフィールを見られます。', '気になる話は「メモ」に手がかりとして残ります。', '右上の「?」から、いつでもこの説明を見直せます。']],
];
function guideHTML() {
  const i = S.guide, [title, lines] = GUIDE[i], last = i === GUIDE.length - 1;
  return `<div class="sheet-wrap" role="dialog" aria-modal="true" aria-label="遊び方"><div class="sheet guide">
    <span class="kicker">スマホの使い方　${i + 1}/${GUIDE.length}</span><h2>${esc(title)}</h2>
    ${lines.map(l => `<p>${esc(l)}</p>`).join('')}
    <div class="gdots" aria-hidden="true">${GUIDE.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="row gbtns">${i ? `<button class="btn-sub" data-act="guide" data-arg="${i - 1}">もどる</button>` : `<button class="btn-sub" data-act="guide" data-arg="close">とじる</button>`}
      <button class="btn-main" data-act="guide" data-arg="${last ? 'close' : i + 1}">${last ? 'はじめる' : 'つぎへ'}</button></div>
  </div></div>`;
}
function profileHTML() {
  const id = S.profile, c = C[id], ch = S.chars[id], met = S.matched.includes(id);
  const rec = met ? `<dl class="rec">
      <div><dt>マッチ</dt><dd>${ch.since}日目</dd></div>
      <div><dt>${C[id].remote ? 'デート・通話' : 'デート'}</dt><dd>${ch.dates}回</dd></div>
      <div><dt>${C[id].remote ? '最後に話した日' : '最後に会った日'}</dt><dd>${ch.lastDate ? `${ch.lastDate}日目` : 'まだ会っていない'}</dd></div>
      <div><dt>好感度</dt><dd ${who(id)}>${hearts(ch.aff)}</dd></div>
    </dl>` : '';
  return `<div class="sheet-wrap" role="dialog" aria-modal="true" aria-label="${esc(c.short)}のプロフィール"><div class="sheet prof">
    <article class="pcard" ${who(id)}>
      <div class="photo"><img class="px" src="${PORTRAIT[id]}" alt="${esc(c.short)}の写真">
        <div class="badges"><span class="badge">本人確認済み</span>${c.mode === '友達' ? '<span class="badge friend">友達モード</span>' : ''}${relTag(id)}</div></div>
      <div class="pinfo"><h2>${esc(c.full)}<small>${c.age}歳</small></h2>
        <p class="job">${esc(c.job)}${c.entry ? `　・　${esc(c.login)}` : ''}${ch.offApp ? '　・　Lumi は退会し、LINE でやりとりしている' : ''}</p><p class="bio">${esc(c.bio)}</p>
        <div class="tags">${c.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div></div>
    </article>
    ${rec}
    <div class="row gbtns"><button class="btn-sub" data-act="closeProfile">とじる</button>${met && !(S.view === 'thread' && S.open === id) ? `<button class="btn-main" data-thread="${id}">トークを開く</button>` : ''}</div>
  </div></div>`;
}

function tabsHTML() {
  const unread = Object.values(S.threads).reduce((a, t) => a + t.unread, 0);
  const tabs = [['home', '⌂', 'ホーム', 0], ['talk', '✉', 'トーク', unread], ['lumi', '♥', 'Lumi', 0], ['memo', '✎', 'メモ', S.newClues], ['bank', '¥', '銀行', 0]];
  const cur = S.view === 'thread' ? 'talk' : S.view === 'shop' ? 'home' : S.view;
  return `<nav class="tabs">${tabs.map(([k, ic, label, n]) => `<button class="tab ${cur === k ? 'on' : ''}" data-tab="${k}"><span class="ic" aria-hidden="true">${ic}</span>${label}${n ? `<span class="dot">${n}</span>` : ''}</button>`).join('')}</nav>`;
}

const app = document.getElementById('app');
function render() {
  let inner, fill = false, tabs = false;
  if (!S) inner = titleHTML();
  else {
    const vw = S.view;
    tabs = ['home', 'talk', 'thread', 'lumi', 'memo', 'bank', 'shop'].includes(vw);
    if (vw === 'story') { inner = storyHTML(); fill = true; }
    else if (vw === 'thread') { inner = threadHTML(); fill = true; }
    else if (vw === 'swipe') inner = swipeHTML();
    else if (vw === 'talk') inner = talkHTML();
    else if (vw === 'lumi') inner = lumiHTML();
    else if (vw === 'memo') inner = memoHTML();
    else if (vw === 'bank') inner = bankHTML();
    else if (vw === 'shop') inner = shopHTML();
    else if (vw === 'over') inner = overHTML();
    else if (vw === 'end') inner = endHTML();
    else inner = homeHTML();
  }
  app.innerHTML = `<div class="stage"><div class="phone">
    <div class="sbar"><span>${clock()}</span><span class="bat">${S && S.view !== 'story' ? 'Lumi　' : ''}▮▮▮ 82%</span></div>
    <div class="view ${fill ? 'fill' : ''}" id="view">${inner}</div>
    ${tabs ? tabsHTML() : ''}
    ${tabs && S.profile ? profileHTML() : ''}${tabs && S.guide != null ? guideHTML() : ''}
  </div></div>`;
  const sc = document.getElementById('scroller');
  if (sc) sc.scrollTop = sc.scrollHeight;
  if (S && S.view === 'swipe') bindSwipe();
}
function advance(all) {
  const st = S && S.view === 'story' && S.story;
  if (!st || st.shown >= st.log.length) return;
  st.shown = all ? st.log.length : st.shown + 1;
  render();
}

/* ---------- swipe gesture ---------- */
let flying = false;
function fly(yes) {
  if (flying) return;
  const card = document.getElementById('swcard');
  if (!card || reduceMotion()) { ACT.swipe(yes); return; }
  flying = true;
  card.style.transition = 'transform .24s ease, opacity .24s ease';
  card.style.setProperty(yes ? '--yes' : '--no', 1);
  card.style.transform = `translateX(${yes ? 480 : -480}px) rotate(${yes ? 18 : -18}deg)`;
  card.style.opacity = '0';
  setTimeout(() => { flying = false; ACT.swipe(yes); }, 220);
}
function bindSwipe() {
  const card = document.getElementById('swcard');
  if (!card) return;
  let x0 = null, dx = 0;
  card.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
  card.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    card.style.setProperty('--yes', Math.max(0, Math.min(1, dx / 90)));
    card.style.setProperty('--no', Math.max(0, Math.min(1, -dx / 90)));
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null; card.style.transition = '';
    if (dx > 90) fly(true); else if (dx < -90) fly(false);
    else { card.style.transform = ''; card.style.setProperty('--yes', 0); card.style.setProperty('--no', 0); }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

/* ---------- input ---------- */
app.addEventListener('submit', e => {
  if (e.target.id !== 'startForm') return;
  e.preventDefault();
  newGame(document.getElementById('pname').value.trim().slice(0, 8));
});
app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) { if (e.target.closest('.story-log')) advance(false); return; }
  const d = b.dataset;
  if (d.adv) { advance(d.adv === 'all'); return; }
  if (d.tab) { ACT.tab(d.tab); return; }
  if (d.thread) { ACT.openThread(d.thread); return; }
  if (d.prof) { ACT.profile(d.prof); return; }
  if (d.sw !== undefined) { if (d.sw === 'close') ACT.closeSwipe(); else fly(d.sw === '1'); return; }
  if (d.act) { ACT[d.act](d.arg); return; }
  if (d.o !== undefined) { const o = OPTS[+d.o]; if (o && !o.disabled) ACT[o.act](o.arg); return; }
  if (d.i !== undefined && S && S.story) {
    const c = S.story.choices[+d.i];
    if (c && !c.disabled) {
      if (c.me) { S.story.log.push(['me', c.me]); S.meFlag = true; }
      ACT[c.act](c.arg);
    }
  }
});
document.addEventListener('keydown', e => {
  if (S && e.key === 'Escape' && (S.profile || S.guide != null)) { S.profile = null; S.guide = null; render(); return; }
  if (S && S.view === 'story' && (e.key === 'Enter' || e.key === ' ') && !e.target.closest('button,input,summary')) { e.preventDefault(); advance(false); return; }
  if (!S || S.view !== 'swipe') return;
  if (e.key === 'ArrowRight') fly(true);
  if (e.key === 'ArrowLeft') fly(false);
});

registerCast();
buildPortraits();
window.claude?.hot?.snapshot?.(() => ({ S }));
const boot = d => { if (d && d.S && d.S.v === 10) S = d.S; render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
