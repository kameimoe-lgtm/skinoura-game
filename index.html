<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>スキのウラ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a phone novel game — matching-app swipe deck first, then status bar, cast strip, message window, clue notebook. */
:root{
  --paper:#eef6fb; --card:#fafdff; --ink:#142838; --muted:#5d7385; --line:#d2e3ee; --wash:#e1eff8;
  --rose:#1f7fb8; --on-rose:#ffffff; --wolf:#a3122a; --wolf-wash:#fbe3e6; --good:#2f7d55; --skip:#5d6b80;
  --c-minato:#4c8760; --c-rei:#7351c0; --c-sakura:#cc4f77; --c-sou:#3d6898; --c-haruto:#a8682c;
  --c-miya:#b07a12; --c-yanagi:#7a5a44; --c-nanase:#4f7186; --c-you:#b8492f;
  --f-display:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1921; --card:#15232e; --ink:#e5f1f8; --muted:#9ab1c2; --line:#253a49; --wash:#1b2e3b;
  --rose:#6cc4f0; --on-rose:#06202e; --wolf:#ff7084; --wolf-wash:#3a1820; --good:#7fd1a3; --skip:#a9b6c9;
  --c-minato:#8cc59c; --c-rei:#b49cf2; --c-sakura:#f394ad; --c-sou:#90b4de; --c-haruto:#e3a96f;
  --c-miya:#ebc060; --c-yanagi:#c9a68a; --c-nanase:#9cc0d4; --c-you:#f2907a;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e1921; --card:#15232e; --ink:#e5f1f8; --muted:#9ab1c2; --line:#253a49; --wash:#1b2e3b;
  --rose:#6cc4f0; --on-rose:#06202e; --wolf:#ff7084; --wolf-wash:#3a1820; --good:#7fd1a3; --skip:#a9b6c9;
  --c-minato:#8cc59c; --c-rei:#b49cf2; --c-sakura:#f394ad; --c-sou:#90b4de; --c-haruto:#e3a96f;
  --c-miya:#ebc060; --c-yanagi:#c9a68a; --c-nanase:#9cc0d4; --c-you:#f2907a;
  color-scheme:dark }

html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.85;
  background-image:radial-gradient(var(--line) 1px, transparent 1.2px);background-size:22px 22px}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pf{background:color-mix(in srgb,var(--who) 24%,var(--card));border-radius:10px;overflow:hidden;flex:none}

/* ---- title ---- */
.hero{display:flex;flex-direction:column;gap:14px;padding-block:28px 8px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,16vw,104px);line-height:1;margin:0;letter-spacing:.02em}
.ura{display:inline-block;transform:scaleX(-1);color:var(--rose)}
.lead{font-family:var(--f-display);font-size:clamp(18px,4.6vw,22px);line-height:1.6;margin:0;text-wrap:balance}
.lineup{display:flex;gap:8px;flex-wrap:wrap}
.lineup .pf{width:64px;height:64px}
.lineup .pf img{width:100%;height:100%}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:4.5em 1fr;gap:12px;align-items:baseline}
.rules b{font-family:var(--f-display);color:var(--rose);font-size:13px}
.rules span{min-width:0}
.start{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:18px;border:1px solid var(--line);background:var(--card);border-radius:14px}
.start label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1 1 180px;min-width:0}
.start input{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.btn-main{background:var(--rose);color:var(--on-rose);border:0;border-radius:999px;padding:12px 26px;font-weight:700}
.btn-sub{background:transparent;border:1px solid var(--line);border-radius:999px;padding:10px 20px}

/* ---- matching app ---- */
.appbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.applogo{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--rose);letter-spacing:.04em}
.appsub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.deck{display:flex;justify-content:center;padding-block:4px}
.pcard{position:relative;width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 10%,transparent);transition:transform .2s ease}
.photo{position:relative;aspect-ratio:1/1;max-width:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--who) 30%,var(--card)),color-mix(in srgb,var(--who) 55%,var(--card)));display:flex;align-items:flex-end;justify-content:center}
.photo img{width:84%;height:84%}
.badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;background:var(--card);color:var(--ink);border-radius:999px;padding:2px 10px}
.badge.friend{background:var(--ink);color:var(--card)}
.pinfo{padding:14px 18px 18px;display:flex;flex-direction:column;gap:6px}
.pinfo h2{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.2}
.pinfo h2 small{font-family:var(--f-body);font-size:15px;color:var(--muted);font-weight:400;margin-left:6px}
.pinfo .job{margin:0;font-size:13px;color:var(--muted)}
.pinfo .bio{margin:0;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--muted)}
.stamp{position:absolute;top:24px;font-family:var(--f-display);font-weight:700;font-size:28px;padding:2px 14px;border:3px solid;border-radius:10px;pointer-events:none}
.stamp.yes{left:20px;color:var(--rose);transform:rotate(-12deg);opacity:var(--yes,0)}
.stamp.no{right:20px;color:var(--skip);transform:rotate(12deg);opacity:var(--no,0)}
.swbtns{display:flex;justify-content:center;gap:28px}
.sw{width:64px;height:64px;border-radius:50%;border:2px solid;background:var(--card);font-size:26px;line-height:1;display:grid;place-items:center}
.sw.no{color:var(--skip)}
.sw.yes{color:var(--rose)}
.center{text-align:center}

/* ---- status ---- */
.bar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.bar .name{font-family:var(--f-display);font-weight:700;font-size:20px}
.bar .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .meta strong{color:var(--ink);font-weight:700}
.days{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.days i{height:5px;border-radius:3px;background:var(--line)}
.days i.past{background:color-mix(in srgb,var(--rose) 45%,var(--line))}
.days i.now{background:var(--rose)}

/* ---- cast ---- */
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.member{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);min-width:0}
.member .pf{width:40px;height:40px}
.member .pf img{width:100%;height:100%}
.member .txt{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.member .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{font-size:12px;letter-spacing:1px;color:var(--line)}
.hearts span{color:var(--who)}
.hearts i{font-style:normal;color:var(--muted);letter-spacing:0;margin-left:4px;font-variant-numeric:tabular-nums}

/* ---- message window ---- */
.window{position:relative;background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:5px 5px 0 var(--wash)}
.window .tag{position:absolute;top:-12px;left:18px;background:var(--ink);color:var(--card);font-size:11px;letter-spacing:.12em;padding:2px 12px;border-radius:999px}
.lines{display:flex;flex-direction:column;gap:14px}
.lines.story{max-height:min(66vh,640px);overflow-y:auto;padding-right:6px;cursor:pointer}
.ln{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start}
.ln.new{animation:rise .35s ease both}
.ln.old{opacity:.7}
.ln .who{display:flex;flex-direction:column;align-items:center;gap:2px}
.ln .who .pf{width:44px;height:44px}
.ln .who .pf img{width:100%;height:100%}
.ln .who b{font-size:11px;color:var(--who);white-space:nowrap}
.ln .say{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:8px 14px}
.ln .say .msg{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;line-height:1.4}
.ln.nar,.ln.me,.ln.sys,.ln.day{grid-template-columns:1fr}
.ln.nar .say{background:var(--wash);border:0;border-radius:10px;padding:10px 16px}
.ln.me{justify-items:end}
.ln.me .say{background:var(--rose);color:var(--on-rose);border:0;border-radius:16px 4px 16px 16px;max-width:85%;font-weight:500}
.ln.sys{justify-items:center}
.ln.sys .say{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-size:12px;border-radius:999px;padding:1px 14px}
.ln.day{justify-items:center;padding-top:2px}
.ln.day .say{background:transparent;border:0;padding:0;font-family:var(--f-display);font-weight:700;color:var(--rose);letter-spacing:.06em}
.adv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px;border-top:1px dashed var(--line)}
.next{border:0;background:transparent;color:var(--rose);font-weight:700;padding:6px 2px;display:flex;gap:8px;align-items:center}
.next .tri{display:inline-block;animation:bob 1s ease-in-out infinite}
.skip{font-size:12px;color:var(--muted);background:transparent;border:0;text-decoration:underline;padding:6px 2px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(3px)}}
@media (prefers-reduced-motion:reduce){.ln.new,.next .tri{animation:none}.pcard{transition:none}}
.choices{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px dashed var(--line)}
.choice{text-align:left;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:flex;justify-content:space-between;gap:12px;align-items:center}
.choice:hover:not(:disabled){border-color:var(--rose);background:var(--wash)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice small{color:var(--muted);font-size:11px;white-space:nowrap}

/* ---- notebook ---- */
.note h2{font-family:var(--f-display);font-size:17px;margin:0 0 2px}
.note p.hint{margin:0 0 10px;font-size:12px;color:var(--muted)}
.note details{border-top:1px solid var(--line);padding:8px 0}
.note summary{cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center}
.note summary .dot{width:10px;height:10px;border-radius:50%;background:var(--who)}
.note summary .count{font-weight:400;color:var(--muted);font-size:12px}
.note ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.note li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px}
.note li em{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;height:fit-content;white-space:nowrap}
.note li span{min-width:0}
.empty{font-size:13px;color:var(--muted);margin:0}

/* ---- endings ---- */
.end{display:flex;flex-direction:column;gap:18px;padding-block:20px}
.end .kicker{font-size:12px;letter-spacing:.16em;color:var(--muted)}
.end h1{font-family:var(--f-display);font-size:clamp(32px,8.5vw,54px);line-height:1.2;margin:0;text-wrap:balance}
.end.over h1{color:var(--wolf)}
.end.over .window{border-color:var(--wolf);box-shadow:5px 5px 0 var(--wolf-wash)}
.reveal{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:14px;background:var(--wash)}
.reveal h3{margin:0;font-size:14px;letter-spacing:.06em}
.reveal p{margin:0}
.wolfmark{color:var(--wolf);font-weight:700}
.wolves{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.wolves li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;font-size:14px;line-height:1.5}
.wolves .pf{width:40px;height:40px}
.wolves .pf img{width:100%;height:100%}
.wolves span{min-width:0}
.wolves small{color:var(--muted);font-size:12px}
.okmark{color:var(--good);font-weight:700}
.tally{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tally li{display:grid;grid-template-columns:5em 1fr auto;gap:10px;align-items:center;font-size:14px}
.tally .meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tally .meter b{display:block;height:100%;background:var(--who)}
.tally .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px}
</style>

<div id="app"></div>

<script>
const ALL_IDS = ['minato','rei','sakura','sou','haruto','nanase','shizuma','gou','kai','iroha','shingo','nagi','ren','akira','shion'];
const WOLF_COUNT = 5;
let IDS = ALL_IDS;
const SPK = {minato:'湊', rei:'レイ', sakura:'さくら', sou:'ソウ', haruto:'ハルト', nanase:'七瀬', you:'ヨウ', miya:'ミヤ', yanagi:'柳', nar:''};
const LAST_DAY = 20, MAX_START = 4, MAX_TOTAL = 6, ADD_UNTIL = 14, PAYDAY = 15;

/* ---------- pixel portraits (16x16) ---------- */
const BASE = [
  '................','................','................','.....SSSSSS.....',
  '....SSSSSSSS....','....SSSSSSSS....','....SESSSSES....','....SESSSSES....',
  '....SBSSSSBS....','....SSSMMSSS....','.....SSSSSS.....','......SSSS......',
  '....CCCWWCCC....','..CCCCCWWCCCCC..','.CCCCCCCCCCCCCC.','.CCCCCCCCCCCCCC.'];
const PX = {
  minato:{c:{H:'#4a3326',C:'#7fae8e',E:'#2b1d2f',G:'#3a2a36'}, h:[
    '................','.....HHHHHH.....','....HHHHHHHH....','...HHHHHHHHHH...','...HHHHHHHHHH...',
    '...HGGG..GGGH...','...HG.G..G.GH...']},
  rei:{c:{H:'#e8c35a',C:'#5b3f9e',E:'#5a3a8a',A:'#f2f2f2'}, h:[
    '................','....HHHHHHH.....','...HHHHHHHHHH...','..HHHHHHHHHHHH..','..HHHHHHHH..HH..',
    '..HH........HH..','..H..........H..','..H..........H..','.............H..','............A...']},
  sakura:{c:{H:'#d98a8f',C:'#f6c1cf',E:'#7a3a4a',A:'#ffd84a'}, h:[
    '................','.....HHHHHH.....','....HHHHHHHH....','...HHHHHHHHAH...','...HHHHHHHHHH...',
    '...HH......HH...','...H........H...','...H........H...','...H........H...','...HH......HH...',
    '...HH......HH...','...HHH....HHH...','...HH......HH...','...HH......HH...']},
  sou:{c:{H:'#1e1e2a',C:'#34445e',E:'#26324a'}, h:[
    '....H..H..H.....','...HHHHHHHHHH...','..HHHHHHHHHHHH..','..HHHHHHHHHHHH..','..HHHHHHHHHHH...',
    '..HHHHHH...HH...','..HHHHH.....H...','..HHH...........']},
  haruto:{c:{H:'#b98a5a',C:'#e9dcc6',E:'#6b4a2a'}, h:[
    '....HH.HH.HH....','...HHHHHHHHHH...','..HHHHHHHHHHHH..','..HHHHHHHHHHHH..','..HHH.HHH.HHHH..',
    '..HH........HH..','...H........H...']},
  miya:{c:{H:'#2a2228',C:'#e5a23b',E:'#2b1d2f'}, h:[
    '................','.....HHHHHH.....','....HHHHHHHH....','...HHHHHHHHHH...','...HHHHHHHHHH...',
    '...HH......HH...','...HH......HH...','...HH......HH...','...HH......HH...','...HHH....HHH...']},
  yanagi:{c:{H:'#b9b4b0',C:'#6b4a33',E:'#2b1d2f',W:'#f4efe6'}, h:[
    '................','................','....HHHHHHHH....','...HHHHHHHHHH...','...HH......HH...',
    '...H........H...','................','................','................','.....HHHHHH.....']},
  nanase:{c:{H:'#3b3f5c',C:'#a7b48a',E:'#2b2f45'}, h:[
    '................','....HHHHHHH.....','...HHHHHHHHH....','...HHHHHHHHHH...','...HHHHHHH.HH...',
    '...HH.......H...','...H............']},
  you:{c:{H:'#3b3f5c',C:'#d0563f',E:'#2b2f45'}, h:[
    '................','....HHHHHHH.....','...HHHHHHHHH....','...HHHHHHHHHH...','...HHHHHHH.HH...',
    '...HH.......H...','...H............']},
};
const PAL = {S:'#f4d0b5', B:'#f3a1ae', M:'#c4566c', W:'#ffffff', E:'#2b1d2f'};
const PORTRAIT = {};
function buildPortraits() {
  for (const id in PX) {
    const cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
    const g = cv.getContext('2d'), p = PX[id], col = { ...PAL, ...p.c };
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const o = (p.h[y] || '')[x];
      const ch = o && o !== '.' ? o : BASE[y][x];
      if (ch === '.' || !col[ch]) continue;
      g.fillStyle = col[ch]; g.fillRect(x, y, 1, 1);
    }
    PORTRAIT[id] = cv.toDataURL();
  }
}
const pfHTML = id => `<div class="pf" style="--who:var(--c-${id})"><img class="px" src="${PORTRAIT[id]}" alt=""></div>`;

/* ---------- cast ---------- */
const C = {
minato:{ full:'朝霧 湊', short:'湊', age:28, job:'会社員（総務）', mode:'恋人', login:'ログイン：24時間以内',
  bio:'料理と読書が好きです。休日は地域の活動に参加しています。穏やかに話せる方と出会えたら嬉しいです。', tags:['料理','読書','ボランティア'], scam:'宗教勧誘',
  talks:[
    {t:[['nar','公園でピクニックデート。湊さんがお弁当を作ってきてくれた'],['minato','作りすぎちゃったかな。{n}さん、好きなものから食べてね']],
     c:[['いただきます！',8,[['minato','どうぞどうぞ。……うん、人と食べるご飯って、やっぱりおいしいね']]],
        ['すごい、全部手作りですか？',12,[['minato','うん。朝5時に起きちゃった。……ふふ、ちょっと張りきりすぎたね']]],
        ['朝ごはん食べすぎちゃって……',-2,[['minato','そっか。じゃあ、持って帰って夜に食べて']]]]},
    {t:[['nar','喫茶かもめの窓ぎわの席。湊さんは紅茶のカップを両手で包んでいる'],['minato','{n}さん、仕事はどう？　春から新しい環境なんだよね']],
     c:[['正直、けっこうしんどいです',11,[['minato','そっか。話してくれて嬉しいよ。しんどいって言える人は、ちゃんと強い人だから']]],
        ['ぜんぜん平気です！',4,[['minato','そう？　それならいいんだけど。無理だけはしないでね']]],
        ['湊さんこそ、どうなんですか？',9,[['minato','僕？　……そう聞かれるの、久しぶりだな。ありがとう']]]]},
    {t:[['nar','夜の川沿いを、ふたりで歩いた。湊さんが、遠くの街の灯りを眺めている'],['minato','{n}さんは、将来こうなりたい、みたいなのってある？']],
     c:[['まだ分からないです',7,[['minato','うん、それでいいと思う。分からないって正直に言えるの、いいね']]],
        ['誰かの役に立つ人になりたい',11,[['minato','……素敵だね。僕も、ずっとそうなりたいと思ってるんだ']]],

/* Characters defined after the core cast carry their own px / colors / after; register them here. */
function registerCast() {
  IDS = ALL_IDS.filter(id => C[id]);
  let light = '', dark = '';
  IDS.forEach(id => {
    const c = C[id];
    if (!PX[id] && c.px) PX[id] = c.px;
    if (!SPK[id]) SPK[id] = c.short;
    if (!AFTER[id] && c.after) AFTER[id] = c.after.map(m => (Array.isArray(m) ? m[m.length - 1] : m));
    if (c.colors) { light += `--c-${id}:${c.colors.light};`; dark += `--c-${id}:${c.colors.dark};`; }
  });
  const st = document.createElement('style');
  st.textContent = `:root{${light}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}}:root[data-theme="dark"]{${dark}}`;
  document.head.appendChild(st);
}

const pool = () => IDS.filter(id => !S.matched.includes(id));

function freeDays(lo, hi) { const r = []; for (let d = lo; d <= hi; d++) if (!S.schedule[d]) r.push(d); return r; }
function pickDay(lo, hi) {
  if (lo > LAST_DAY) return null;
  let c = freeDays(lo, Math.min(hi, LAST_DAY));
  if (!c.length) c = freeDays(lo, LAST_DAY).slice(0, 1);
  return c.length ? shuffle(c)[0] : null;
}
function match(id) {
  S.matched.push(id);
  S.chars[id].since = S.day;
  const sd = pickDay(S.day + 2, S.day + 4);
  if (sd) S.schedule[sd] = { id, kind: 'small' };
  const bd = pickDay(Math.max(12, S.day + 5, (sd || 0) + 1), 18);
  if (bd) S.schedule[bd] = { id, kind: 'big' };
}

/* ---------- flow ---------- */
function newGame(name) {
  S = { name: name || 'ミオ', day: 1, money: 60000, wolves: shuffle(IDS).slice(0, WOLF_COUNT), picks: [], outfit: 0, gift: false, shopped: 0, lastDateCost: 0,
        schedule: {}, repay: [], chars: {}, clues: {}, matched: [], screen: 'play', scene: null,
        swipe: null, guess: null, overBy: null, log: [], shown: 0, sceneStart: 0, meFlag: false,
        twinNow: null, knowTwin: false, twinCaught: 0, motif: Math.floor(Math.random() * MOTIFS.length), motifKnown: false, decoy: {}, partner: null, v: 9 };
  const decoys = shuffle(DECOYS.map((_, i) => i));
  IDS.forEach((id, i) => {
    S.chars[id] = { aff: 20, sns: 0, obs: 0, tell: 0, used: [], dates: 0, hooked: false, bigDone: false, since: 0, claim: false, evidence: false, confronted: false, exposed: false };
    S.clues[id] = []; S.decoy[id] = decoys[i % decoys.length];
  });
  scene('はじまり', [
    ['nar', '春。上京して3週間、まだ友達はひとりもいない'],
    ['miya', '{n}、寂しいって言ってたじゃん。マッチングアプリ入れなよ。「Lumi」なら、恋人も友達も探せるから'],
    ['miya', '……でも、気をつけてね。「好き」って言いながら、お金とか勧誘が目当ての人も混ざってるから'],
    ['nar', `上京資金の残りは6万円。アプリを開くと、${IDS.length}人のプロフィールが届いていた`],
  ], [{ label: 'アプリを開く', act: 'openSwipe', arg: 'start' }]);
}

const ACT = {
  openSwipe(mode) {
    const deck = mode === 'start' ? shuffle(IDS) : pool();
    S.swipe = { mode, deck, pos: 0, added: [] };
    S.screen = 'swipe'; render();
  },

  swipe(yes) {
    const sw = S.swipe, id = sw.deck[sw.pos];
    if (yes) { match(id); sw.added.push(id); }
    sw.pos++;
    const full = sw.mode === 'start' ? S.matched.length >= MAX_START : S.matched.length >= MAX_TOTAL;
    if (full || sw.pos >= sw.deck.length) {
      if (sw.mode === 'start' && !S.matched.length) { sw.deck = shuffle(IDS); sw.pos = 0; sw.retry = true; render(); return; }
      ACT.closeSwipe();
      return;
    }
    render();
  },

  closeSwipe() {
    const sw = S.swipe, names = sw.added.map(id => C[id].short).join('、');
    S.swipe = null;
    if (sw.mode === 'start') {
      scene('マッチ成立', [
        ['nar', `${names}とマッチした！`],
        ['miya', 'お、いい感じじゃん。デートするなら駅前の「喫茶かもめ」がおすすめ。マスターの柳さん、人を見る目だけは確かだから'],
        ['miya', '怪しいと思ったら、わたしに言って。SNSなら秒で調べてあげる'],
        ['nar', `いいねしなかった人とは、${ADD_UNTIL}日目までならアプリからマッチできる`],
      ], [{ label: '1日目をはじめる', act: 'dayStart' }]);
    } else {
      ACT.menu([['nar', sw.added.length ? `${names}とマッチした！` : 'アプリを閉じた']]);
    }
  },

  menu(pre) {
    const canAdd = S.day <= ADD_UNTIL && pool().length > 0 && S.matched.length < MAX_TOTAL;
    const dated = S.matched.some(id => S.chars[id].dates > 0);
    scene('今日の過ごし方', [...(Array.isArray(pre) ? pre : []), ['nar', 'さて、今日はどうしよう？']], [
      ...S.matched.map(id => { const cost = dateCost(id), off = cost > S.money;
        return { label: `${C[id].short}とデートする`, act: 'talk', arg: id, disabled: off, note: off ? 'お金が足りない' : `デート代 ${yen(cost)}` }; }),
      { label: 'ミヤにSNSを調べてもらう', act: 'snsMenu', note: '1日を使う' },
      { label: '喫茶かもめで柳さんに話を聞く', act: 'obsMenu', disabled: !dated, note: dated ? '1日を使う' : '誰かとデートしてから' },
      ...(canAdd ? [{ label: 'アプリでほかの人を見る', act: 'openSwipe', arg: 'add', note: '1日を使わない' }] : []),
      { label: '買い物に行く', act: 'shopMenu', disabled: S.shopped === S.day, note: S.shopped === S.day ? '今日はもう行った' : '1日を使わない' },
    ]);
  },

  dayStart() {
    S.log = [['day', `${S.day}日目　${dateLabel(S.day)}`], ['nar', DAY_FLAVOR[S.day - 1]]];
    S.shown = 0; S.meFlag = false;
    const pre = [];
    S.repay = S.repay.filter(r => {
      if (r.day !== S.day) return true;
      S.money += r.amount; addAff(r.id, 3);
      pre.push(...r.lines, ['nar', `${C[r.id].short}から${yen(r.amount)}が返ってきた`]);
      return false;
    });
    if (S.day === PAYDAY) { S.money += 50000; pre.push(['nar', '給料日！　初めてのお給料が振り込まれた'], ['sys', `所持金 +${yen(50000)}`]); }
    else if (S.day >= 2 && Math.random() < 0.25) {
      const [amt, text] = LIFE_EVENTS[Math.floor(Math.random() * LIFE_EVENTS.length)];
      const real = amt < 0 ? -Math.min(-amt, S.money) : amt;
      S.money += real;
      pre.push(['nar', text], ['sys', `所持金 ${real < 0 ? '−' : '+'}${yen(Math.abs(real))}`]);
    }
    const ev = S.schedule[S.day];
    if (ev) ACT.request({ id: ev.id, kind: ev.kind, pre });
    else ACT.menu(pre);
  },

  request({ id, kind, pre = [] }) {
    const R = C[id].req[kind];
    const lover = S.partner === id ? [['nar', `恋人の${C[id].short}が、あなたを頼るように見つめてくる。断ったら、きっとすごく悲しませてしまう`]] : [];
    scene('お願い', [...pre, ['nar', `スマホが鳴った。${C[id].short}からだ`], ...R.ask, ...lover], [
      { label: '引き受ける', me: 'うん、いいよ', act: 'answer', arg: { id, kind, yes: true } },
      { label: '断る', me: 'ごめん、それはできない', act: 'answer', arg: { id, kind, yes: false } },
      { label: '詳しく聞く', me: 'もう少し詳しく聞かせて', act: 'detail', arg: { id, kind } },
    ]);
  },

  detail({ id, kind }) {
    const lines = C[id].req[kind].detail[v(id)];
    addAff(id, -3);
    clue(id, kind === 'big' ? '大きなお願い' : 'お願い', lines.map(l => l[1]).join(' '));
    scene('お願い', [...lines, MEMO], [
      { label: '引き受ける', me: 'わかった、引き受けるよ', act: 'answer', arg: { id, kind, yes: true, asked: true } },
      { label: '断る', me: 'ごめん、やっぱりできない', act: 'answer', arg: { id, kind, yes: false, asked: true } },
    ]);
  },

  // Wolves react with the same heart changes as sincere people, so the numbers never give them away.
  answer({ id, kind, yes, asked }) {
    const R = C[id].req[kind], k = v(id), ch = S.chars[id];
    let lines, d;
    if (kind === 'big') ch.bigDone = true;
    if (yes) {
      if (kind === 'big' && k === 'wolf') { S.overBy = id; S.screen = 'over'; render(); return; }
      const cost = R.cost[k] || 0;
      if (cost > S.money) {
        lines = [['nar', `手持ちが${yen(S.money)}しかなくて、${yen(cost)}を用意できなかった`], ['nar', `${C[id].short}は「気にしないで」と言ったけれど、少しさみしそうだった`]];
        d = -3;
      } else {
        S.money -= cost; lines = [...R.accept[k]]; d = R.gain.true;
        if (!asked) { d += 5; lines.push(['nar', `何も聞かずに信じてくれたことが、${C[id].short}にはうれしかったみたいだ`]); }
        if (k === 'wolf') ch.hooked = true;
        if (cost) lines.push(['sys', `所持金 −${yen(cost)}`]);
        if (R.repay && R.repay[k]) S.repay.push({ day: S.day + 3, id, amount: R.repay[k].amount, lines: R.repay[k].lines });
      }
    } else {
      lines = [...R.refuse[k]]; d = R.loss.true * (S.partner === id ? 2 : 1);
      if (kind === 'big' && k === 'wolf' && ch.aff + d >= 70) lines.push(...C[id].waver);
    }
    addAff(id, d);
    lines.push(heart(id, d));
    scene('お願い', lines, [{ label: 'この日の過ごし方を決める', act: 'menu' }]);
  },

  shopMenu() {
    const c = (label, price, item, note) => ({ label: `${label}（${yen(price)}）`, act: 'buy', arg: item, disabled: price > S.money, note: price > S.money ? 'お金が足りない' : note });
    scene('買い物', [['nar', '仕事帰りに、駅ビルに寄った']], [
      c('新しい服を買う', 8000, 'outfit', '次の3回のデートで ♥ +3'),
      c('ちょっとしたプレゼントを買う', 3000, 'gift', '次のデートの相手に ♥ +6'),
      c('宝くじを1枚買う', 300, 'lottery', '当たるかも？'),
      { label: 'やっぱりやめる', act: 'menu' },
    ]);
  },

  buy(item) {
    S.shopped = S.day;
    let lines;
    if (item === 'outfit') { S.money -= 8000; S.outfit = 3; lines = [['nar', '春らしい色の服を買った。鏡の前で、少しだけ背すじが伸びた'], ['sys', `所持金 −${yen(8000)}`]]; }
    else if (item === 'gift') { S.money -= 3000; S.gift = true; lines = [['nar', '小さな紙袋に入ったプレゼントを買った。次に会う人に渡そう'], ['sys', `所持金 −${yen(3000)}`]]; }
    else {
      S.money -= 300;
      const r = Math.random();
      const win = r < 0.01 ? 100000 : r < 0.06 ? 10000 : r < 0.26 ? 300 : 0;
      S.money += win;
      lines = [['nar', 'その場でスクラッチを削ってみた'],
        win === 100000 ? ['nar', '……1等!?　手がふるえて、もう一度数字を確かめた'] : win === 10000 ? ['nar', '3等が当たった！　思わず小さくガッツポーズをした'] : win === 300 ? ['nar', '末等。300円が戻ってきた'] : ['nar', 'はずれ。まあ、そんなものだ'],
        ['sys', `所持金 ${win - 300 >= 0 ? '+' : '−'}${yen(Math.abs(win - 300))}`]];
    }
    ACT.menu(lines);
  },

  talk(id) {
    const ch = S.chars[id];
    ch.dates++;
    S.lastDateCost = dateCost(id);
    S.money -= S.lastDateCost;
    if (C[id].twin) {
      const yo = ch.dates > 1 && Math.random() < (v(id) === 'wolf' ? 0.5 : 0.3);
      S.twinNow = yo ? 'yo' : 'yu';
      const free = [0, 1, 2].find(i => !ch.used.includes(i));
      const k = free === undefined ? 3 : free;
      if (free !== undefined) ch.used.push(free);
      const T = C[id].talks[k];
      const lines = [['nar', `待ち合わせ場所に、${C[id].short}くんの姿が見えた`], ...T.t[S.twinNow]];
      if (k === 1 && !yo && !S.knowTwin) {
        S.knowTwin = true;
        lines.push(MEMO);
        clue(id, 'デート', '七瀬くんには、ヨウという双子の弟がいる。昔からよく間違えられるらしい');
      }
      const choices = T.c.map((c, ci) => ({ label: c[0], me: c[0], act: 'talkAns', arg: { id, idx: k, ci } }));
      if (S.knowTwin) choices.push({ label: '……もしかして、ヨウくん？', me: '……ねえ。もしかして、ヨウくん？', act: 'accuse', arg: id, note: '見破る' });
      scene('デート', lines, [...choices, ...confrontChoice(id)]);
      return;
    }
    const meet = ['nar', `待ち合わせ場所に、${C[id].short}の姿が見えた`];
    const idx = [0, 1, 2].find(i => !ch.used.includes(i));
    if (idx === undefined) {
      scene('デート', [meet], [{ label: 'のんびり過ごす', act: 'talkAns', arg: { id, idx: -1 } }, ...confrontChoice(id)]);
      return;
    }
    ch.used.push(idx);
    const T = C[id].talks[idx];
    scene('デート', [meet, ...T.t], [...T.c.map((c, ci) => ({ label: c[0], me: c[0], act: 'talkAns', arg: { id, idx, ci } })), ...confrontChoice(id)]);
  },

  talkAns({ id, idx, ci }) {
    const ch = S.chars[id];
    let lines, d;
    if (idx === -1) { lines = [['nar', `${C[id].short}と、のんびりデートをした`]]; d = 5; }
    else if (C[id].twin) {
      const c = C[id].talks[idx].c[ci], yo = S.twinNow === 'yo';
      lines = [...(yo ? c[4] : c[2])]; d = yo ? c[3] : c[1];
    }
    else { const c = C[id].talks[idx].c[ci]; lines = [...c[2]]; d = c[1]; }
    if (S.outfit > 0) { S.outfit--; d += 3; lines.push(['nar', `${C[id].short}が、新しい服をほめてくれた`]); }
    if (S.gift) { S.gift = false; d += 6; lines.push(['nar', `${C[id].short}にプレゼントを渡すと、とても喜んでくれた`]); }
    addAff(id, d);
    lines.push(heart(id, d), ['sys', `デート代 −${yen(S.lastDateCost)}`]);
    const tp = C[id].twin ? C[id].tells[S.twinNow === 'yo' && v(id) === 'wolf' ? 'wolf' : 'true'] : C[id].tells[v(id)];
    if (ch.tell < tp.length && Math.random() < 0.6) {
      const t = tp[ch.tell++];
      lines.push(['nar', '別れぎわ、ふと思い出したように——'], [id, t], MEMO);
      clue(id, 'デート', t);
    }
    if (C[id].lie && !ch.claim) {
      ch.claim = true;
      lines.push(['nar', '話の流れで、最近どう過ごしていたかの話になった'], ...C[id].lie.claim, MEMO);
      clue(id, '本人の話', C[id].lie.claim.map(l => l[1]).join(' '));
    }
    const liar = v(id) === 'wolf' && (!C[id].twin || S.twinNow === 'yo');
    if (Math.random() < (liar ? 0.5 : 0.4)) {
      const t = (liar ? MOTIFS[S.motif].scene : DECOYS[S.decoy[id]]).split('{c}').join(C[id].short);
      lines.push(['nar', t], MEMO);
      clue(id, '持ち物', t);
    }
    if (CONFESS[id] && !S.partner && !ch.confessed && ch.aff >= 90) {
      ch.confessed = true;
      lines.push(['nar', '帰り道。ふいに、足が止まった'], ...CONFESS[id].ask);
      scene('デート', lines, [
        { label: '付き合う', me: 'うん。……よろしくお願いします', act: 'confessAns', arg: { id, yes: true } },
        { label: 'ごめん、まだ友達でいたい', me: 'ごめんね。……まだ、友達でいたいな', act: 'confessAns', arg: { id, yes: false } },
      ]);
      return;
    }
    const msgs = C[id].twin && S.twinNow === 'yo' ? AFTER.you : AFTER[id];
    lines.push(['nar', 'その夜、スマホが小さく鳴った'], [id, msgs[(ch.dates - 1) % 3], 'msg']);
    scene('デート', lines, [toDay]);
  },

  confessAns({ id, yes }) {
    let lines;
    if (yes) {
      S.partner = id; addAff(id, 5);
      lines = [...CONFESS[id].yes, ['sys', `${C[id].short}と付き合うことになった`], heart(id, 5)];
      clue(id, 'デート', `${C[id].short}に告白されて、付き合うことにした`);
    } else {
      addAff(id, -8);
      lines = [...CONFESS[id].no, heart(id, -8)];
    }
    scene('デート', lines, [toDay]);
  },

  accuse(id) {
    let lines;
    if (S.twinNow === 'yo') {
      S.twinCaught++; addAff(id, 8);
      lines = [...C[id].caught[v(id)], MEMO, heart(id, 8)];
      clue(id, 'デート', 'この日デートに来ていたのは、ユウではなく双子の弟のヨウだった');
    } else {
      addAff(id, -6); lines = [...C[id].wrong, heart(id, -6)];
    }
    lines.push(['sys', `デート代 −${yen(S.lastDateCost)}`]);
    scene('デート', lines, [toDay]);
  },

  confront(id) {
    const ch = S.chars[id], L = C[id].lie;
    ch.confronted = true;
    let lines;
    if (v(id) === 'wolf' && C[id].twin && S.twinNow !== 'yo') {
      // The real ユウ knows nothing; the player can try again on a day ヨウ shows up.
      ch.confronted = false; S.knowTwin = true;
      lines = [...L.confront.wolf_yu, MEMO];
      clue(id, '問い詰めた', 'ユウには心当たりがないようだった。食い違いの相手は、別の誰か……？');
    } else if (v(id) === 'wolf') {
      ch.exposed = true;
      lines = [...L.confront.wolf, MEMO];
      clue(id, '問い詰めた', '問い詰めると、言い訳がしどろもどろになった');
      if (!S.motifKnown) {
        S.motifKnown = true;
        const m = MOTIFS[S.motif].item;
        lines.push(['nar', 'その夜、ミヤに今日のことを話した'],
          ['miya', `……それ、ヤバいやつかも。最近アプリで出てる詐欺グループ、仲間うちで「${m}」を目印にしてるらしいよ`],
          ['miya', '同じの持ってる人、ほかにもいなかった？　手がかりメモ、見返してみなよ'], MEMO);
        clue(id, 'ミヤの話', `詐欺グループの目印は「${m}」らしい`);
      }
    } else {
      addAff(id, -4);
      lines = [...L.confront.true, heart(id, -4)];
      clue(id, '問い詰めた', '話を聞くと、ちゃんとした理由があった');
    }
    lines.push(['sys', `デート代 −${yen(S.lastDateCost)}`]);
    scene('デート', lines, [toDay]);
  },

  snsMenu() {
    scene('ミヤ', [['nar', 'ミヤに電話をかけると、3コールで出た'], ['miya', 'はいはーい。で、誰のSNSを見ればいいの？']], [
      ...S.matched.map(id => { const ch = S.chars[id], n = ch.sns, pend = C[id].lie && ch.claim && !ch.evidence;
        return { label: `${C[id].short}`, me: `${C[id].short}のこと、調べてもらえる？`, act: 'sns', arg: id, disabled: n >= 3 && !pend, note: pend ? '本人の話の裏を取る' : n >= 3 ? 'もう調べつくした' : `${n}/3回` }; }),
      { label: 'やっぱりやめる', act: 'menu' },
    ]);
  },

  sns(id) {
    const ch = S.chars[id], L = C[id].lie;
    if (L && ch.claim && !ch.evidence) {
      ch.evidence = true;
      const ev = L.evidence[v(id)];
      clue(id, 'ミヤのSNS調査', ev);
      scene('ミヤ', [['miya', 'ちょっと待ってね……ん？'], ['miya', ev], ['miya', 'これ、この前本人が言ってた話と違くない？'], MEMO, ['nar', '……今度会ったとき、聞いてみてもいいかもしれない']], [toDay]);
      return;
    }
    const text = C[id].sns[v(id)][S.chars[id].sns++];
    if (C[id].twin) S.knowTwin = true;
    clue(id, 'ミヤのSNS調査', text);
    scene('ミヤ', [['miya', 'ちょっと待ってね……あ、出てきた'], ['miya', text], MEMO, ['nar', 'そのあと1時間くらい、ミヤとどうでもいい話で笑った。気づけば、日が暮れていた']], [toDay]);
  },

  obsMenu() {
    scene('喫茶かもめ', [['nar', '喫茶かもめのドアを開けると、カランとベルが鳴った'], ['yanagi', 'いらっしゃい。今日はひとりかい。……誰のことが気になるのかな']], [
      ...S.matched.map(id => { const ch = S.chars[id]; const off = ch.dates === 0 || ch.obs >= 2;
        return { label: C[id].short, me: `${C[id].short}のこと、何か覚えていますか？`, act: 'obs', arg: id, disabled: off, note: ch.dates === 0 ? 'まだここに来ていない' : ch.obs >= 2 ? 'もう聞けることはない' : `${ch.obs}/2回` }; }),
      { label: 'やっぱりやめる', act: 'menu' },
    ]);
  },

  obs(id) {
    const text = C[id].obs[v(id)][S.chars[id].obs++];
    if (C[id].twin) S.knowTwin = true;
    clue(id, '柳さんの話', text);
    scene('喫茶かもめ', [['nar', '柳さんは、カップを拭く手を止めた'], ['yanagi', text], MEMO, ['nar', '柳さんのいれたコーヒーは、少しだけ苦かった']], [toDay]);
  },

  endDay() { S.day++; if (S.day > LAST_DAY) ACT.finale(); else ACT.dayStart(); },

  finale() {
    S.day = LAST_DAY;
    scene('最後の夜', [
      ['nar', `${dateLabel(LAST_DAY)}、夜。アプリの通知が、ひとつずつ静かになっていく`],
      ['miya', '20日間、おつかれ。……ねえ{n}'],
      ['miya', 'マッチした人のなかで、嘘をついてたのは誰だったと思う？　何人選んでもいいよ'],
    ], guessChoices());
  },

  pick(id) {
    const i = S.picks.indexOf(id);
    if (i < 0) S.picks.push(id); else S.picks.splice(i, 1);
    S.scene.choices = guessChoices(); render();
  },
  guess() { S.guess = S.picks.slice(); S.screen = 'ending'; render(); },
  restart() { const n = S ? S.name : ''; newGame(n); },
  toTitle() { S = null; render(); },
};

/* ---------- endings ---------- */
function guessChoices() {
  return [
    ...S.matched.map(id => ({ label: `${S.picks.includes(id) ? '☑' : '☐'}　${C[id].full}`, act: 'pick', arg: id })),
    { label: S.picks.length ? `この${S.picks.length}人で答える` : 'マッチした中に、嘘つきはいなかったと答える', act: 'guess' },
  ];
}

function ending() {
  const metWolves = S.wolves.filter(id => S.matched.includes(id));
  const isConverted = id => { const c = S.chars[id]; return c.bigDone && c.aff >= (c.hooked ? 90 : 80) && (!C[id].twin || S.twinCaught > 0); };
  const converted = metWolves.filter(isConverted);
  const best = S.matched.filter(id => !S.wolves.includes(id)).sort((a, b) => S.chars[b].aff - S.chars[a].aff)[0];
  const ba = best ? S.chars[best].aff : 0;
  let title, lines, kicker;
  if (converted.length) { kicker = 'TRUE END'; title = 'ほんとの好き'; lines = converted.flatMap(id => C[id].convert); }
  else if (S.partner && !S.wolves.includes(S.partner)) {
    const p = S.partner;
    kicker = 'GOOD END'; title = C[p].love.title; lines = C[p].love.lines;
    if (C[p].twin && S.twinCaught > 0) lines = [...lines, ['you', '兄貴のこと、頼んだからな！']];
  }
  else if (S.partner) {
    const p = S.partner;
    kicker = 'BAD END'; title = '偽りの恋人エンド';
    lines = [['nar', `20日目の夜、${C[p].short}からの返信は来なかった`], ['nar', '「付き合おう」と言ってくれたあの日の笑顔は、なんだったんだろう']];
  }
  else if (ba >= 90 && C[best].mode === '友達') { kicker = 'GOOD END'; title = C[best].love.title; lines = C[best].love.lines; }
  else if (ba >= 65) { kicker = 'NORMAL END'; title = `親友エンド　${C[best].full}`; lines = C[best].friend; }
  else { kicker = 'LONELY END'; title = 'ひとりぼっちエンド'; lines = [['nar', '疑いすぎたのかもしれない。誰にもだまされなかったけれど、誰とも近づけなかった'], ['nar', 'アプリの通知は、今夜も鳴らない']]; }
  return { metWolves, converted, title, lines, kicker };
}
// Only wolves the player matched are revealed, so unmatched characters keep their secret for the next run.
const wolfListHTML = (fate) => {
  const met = S.wolves.filter(id => S.matched.includes(id));
  if (!met.length) return '<p>マッチした人のなかに、狼はいませんでした。</p>';
  return `<p>マッチした人のなかの狼は、この${met.length}人でした。</p><ul class="wolves">${met.map(id => `<li ${who(id)}>${pfHTML(id)}<span><b class="wolfmark">${C[id].full}</b>　${esc(C[id].scam)}<br><small>${fate(id)}</small></span></li>`).join('')}</ul>`;
};

/* ---------- render ---------- */
const who = id => `style="--who:var(--c-${id})"`;
const hearts = aff => { const n = Math.round(aff / 20); return `<span>${'♥'.repeat(n)}</span>${'♥'.repeat(5 - n)}`; };
function lineHTML([w, t, kind], cls = '') {
  const say = esc(fmt(t));
  if (w === 'nar' || w === 'me' || w === 'sys' || w === 'day') return `<div class="ln ${w} ${cls}"><div class="say">${say}</div></div>`;
  return `<div class="ln ${cls}" ${who(w)}><div class="who">${pfHTML(w)}<b>${esc(SPK[w])}</b></div><div class="say">${kind === 'msg' ? '<span class="msg">メッセージ</span>' : ''}${say}</div></div>`;
}
const linesHTML = lines => lines.map(l => lineHTML(l)).join('');

function titleHTML() {
  return `<div class="wrap">
  <section class="hero">
    <div class="eyebrow">マッチングアプリ攻略シミュレーション</div>
    <h1 class="logo">スキの<span class="ura">ウラ</span></h1>
    <p class="lead">アプリで出会った${IDS.length}人のなかに、${WOLF_COUNT}人の嘘つきがまぎれている。</p>
  </section>
  <div class="lineup" aria-hidden="true">${IDS.map(pfHTML).join('')}</div>
  <ul class="rules">
    <li><b>スワイプ</b><span>最初に、${IDS.length}人のプロフィールから、デートしたい人を最大${MAX_START}人まで選びます。${ADD_UNTIL}日目までは、あとから追加でマッチできます（同時に${MAX_TOTAL}人まで）。</span></li>
    <li><b>${LAST_DAY}日間</b><span>1日に1回、誰かとデートするか、手がかりを集めます。SNSは幼なじみのミヤが、デート中の様子は喫茶かもめの柳さんが教えてくれます。</span></li>
    <li><b>お金</b><span>デートにはお金がかかります。服やプレゼントを買えば好感度が上がりやすくなり、宝くじで増えることも。${PAYDAY}日目は給料日です。</span></li>
    <li><b>お願い</b><span>マッチした人はときどきお願いをしてきます。本当にあなたが好きな人も、だまそうとしている人も、同じ言葉で頼んできます。</span></li>
    <li><b>矛盾</b><span>相手が話していたことと、ミヤの調べた情報が食い違ったら、デートで問い詰められます。本物ならちゃんと理由があり、狼なら言い訳がほころびます。狼どうしは仲間で、同じ目印を持っているかもしれません。</span></li>
    <li><b>告白</b><span>恋人モードの相手は、好感度が90に届くと告白してきます。付き合えるのは1人だけ。恋人のお願いは断りにくくなります。狼も、本物と同じように告白してきます。</span></li>
    <li><b>見抜く</b><span>狼の大きなお願いを引き受けると、その場でゲームオーバーです。狼は${IDS.length}人のうち${WOLF_COUNT}人で、毎回入れ替わります。最後に、誰が狼だったかを当てましょう。</span></li>
    <li><b>改心</b><span>狼とも仲良くなって、誘いをはねのけ続ければ、心を変えられるかもしれません。</span></li>
  </ul>
  <form class="start" id="startForm">
    <label for="pname">あなたの名前<input id="pname" maxlength="8" value="ミオ" autocomplete="off"></label>
    <button class="btn-main" type="submit">はじめる</button>
  </form>
  <p class="empty">狼は毎回ランダムに決まります。何度でも遊べます。</p>
</div>`;
}

function swipeHTML() {
  const sw = S.swipe, id = sw.deck[sw.pos], c = C[id];
  const sub = sw.mode === 'start' ? `いいね ${S.matched.length}/${MAX_START}　・　${sw.pos + 1}/${sw.deck.length}枚目` : `${sw.pos + 1}/${sw.deck.length}枚目`;
  return `<div class="wrap">
  <div class="appbar"><span class="applogo">Lumi</span><span class="appsub">${sub}</span></div>
  ${sw.retry ? `<p class="empty center">誰かひとりには、いいねしてみましょう。</p>` : ''}
  <div class="deck">
    <article class="pcard" id="swcard" ${who(id)}>
      <div class="photo"><img class="px" src="${PORTRAIT[id]}" alt="${esc(c.short)}の写真">
        <div class="badges"><span class="badge">本人確認済み</span>${c.mode === '友達' ? '<span class="badge friend">友達モード</span>' : ''}</div></div>
      <div class="pinfo">
        <h2>${esc(c.short)}<small>${c.age}歳</small></h2>
        <p class="job">${esc(c.job)}　・　${esc(c.login)}</p>
        <p class="bio">${esc(c.bio)}</p>
        <div class="tags">${c.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>
      </div>
      <div class="stamp yes">いいね</div><div class="stamp no">スキップ</div>
    </article>
  </div>
  <div class="swbtns"><button class="sw no" data-sw="0" aria-label="スキップ">✕</button><button class="sw yes" data-sw="1" aria-label="いいね">♥</button></div>
  <p class="empty center">カードを左右にスワイプするか、下のボタンで選んでください。</p>
  ${sw.mode === 'add' ? `<div class="row" style="justify-content:center"><button class="btn-sub" data-sw="close">アプリを閉じる</button></div>` : ''}
</div>`;
}

function barHTML() {
  return `<div class="bar"><div class="name">スキの<span class="ura">ウラ</span></div>
    <div class="meta"><span>${dateLabel(S.day)}　<strong>${S.day}</strong>/${LAST_DAY}日目</span><span>所持金 <strong>${yen(S.money)}</strong></span></div></div>
    <div class="days" aria-hidden="true">${Array.from({ length: LAST_DAY }, (_, i) => `<i class="${i + 1 < S.day ? 'past' : i + 1 === S.day ? 'now' : ''}"></i>`).join('')}</div>`;
}

function castHTML() {
  if (!S.matched.length) return '';
  return `<div class="cast">${S.matched.map(id => `<div class="member" ${who(id)}>${pfHTML(id)}<div class="txt"><span class="nm">${C[id].short}${S.partner === id ? '（恋人）' : C[id].mode === '友達' ? '（友達）' : ''}</span><span class="hearts" aria-label="好感度 ${S.chars[id].aff}">${hearts(S.chars[id].aff)}<i>${S.chars[id].aff}</i></span></div></div>`).join('')}</div>`;
}

function noteHTML() {
  const ids = IDS.filter(id => S.matched.includes(id) || S.clues[id].length);
  if (!ids.length) return '';
  return `<section class="note"><h2>手がかりメモ</h2><p class="hint">集めた言葉と情報は、ここに残ります。</p>
  ${ids.map(id => `<details ${who(id)}><summary><span class="dot"></span>${C[id].full}<span class="count">${S.clues[id].length}件</span></summary>
    ${S.clues[id].length ? `<ul>${S.clues[id].map(c => `<li><em>${c.day}日目・${esc(c.src)}</em><span>${esc(c.text)}</span></li>`).join('')}</ul>` : `<p class="empty">まだ手がかりがありません。</p>`}
  </details>`).join('')}</section>`;
}

function playHTML() {
  const sc = S.scene, done = S.shown >= S.log.length;
  const shown = S.log.slice(0, S.shown).map((l, i) => lineHTML(l, i === S.shown - 1 ? 'new' : i < S.sceneStart ? 'old' : '')).join('');
  return `<div class="wrap">${barHTML()}${castHTML()}
  <section class="window"><span class="tag">${esc(sc.tag)}</span>
    <div class="lines story" id="story" title="タップで次へ">${shown}</div>
    ${done
      ? `<div class="choices">${sc.choices.map((c, i) => `<button class="choice" data-i="${i}" ${c.disabled ? 'disabled' : ''}><span>${esc(c.label)}</span>${c.note ? `<small>${esc(c.note)}</small>` : ''}</button>`).join('')}</div>`
      : `<div class="adv"><button class="skip" data-adv="all">スキップ</button><button class="next" data-adv="1">つぎへ<span class="tri" aria-hidden="true">▼</span></button></div>`}
  </section>${noteHTML()}</div>`;
}

function tallyHTML() {
  return `<ul class="tally">${S.matched.map(id => `<li ${who(id)}><span>${C[id].short}</span><span class="meter"><b style="width:${S.chars[id].aff}%"></b></span><span class="v">${S.chars[id].aff}</span></li>`).join('')}</ul>`;
}

function overHTML() {
  const id = S.overBy;
  return `<div class="wrap"><section class="end over">
    <div class="kicker">GAME OVER</div><h1>${C[id].over.title}</h1>
    <div class="window"><span class="tag">${S.day}日目</span><div class="lines">${linesHTML(C[id].over.lines)}</div></div>
    <div class="reveal"><h3>答え合わせ</h3>
      <p>あなたが信じた<span class="wolfmark">${C[id].full}</span>は、${esc(C[id].scam)}が目的の狼でした。</p>
      ${wolfListHTML(w => w === id ? 'あなたをだました' : 'まだ正体を見せていなかった')}</div>
    <div class="reveal"><h3>好感度</h3>${tallyHTML()}</div>
    <div class="row"><button class="btn-main" data-go="restart">もう一度あそぶ</button><button class="btn-sub" data-go="toTitle">タイトルへ</button></div>
  </section>${noteHTML()}</div>`;
}

function endingHTML() {
  const e = ending();
  const hit = S.guess.filter(id => S.wolves.includes(id));
  const falsePicks = S.guess.filter(id => !S.wolves.includes(id));
  const missed = e.metWolves.filter(id => !S.guess.includes(id));
  const answer = S.guess.length ? S.guess.map(id => C[id].full).join('、') : '嘘つきはいなかった';
  const guessLine = `あなたの答えは「${esc(answer)}」。` + (!falsePicks.length && !missed.length
    ? '<span class="okmark">全問正解です。</span>'
    : `当たりは${hit.length}人。${missed.length ? `見逃した狼が${missed.length}人、` : ''}${falsePicks.length ? `本当は狼ではなかった人が${falsePicks.length}人` : ''}いました。`.replace(/、いました。$/, 'いました。'));
  const fate = id => !S.matched.includes(id) ? 'マッチしなかったので、近づかれずにすんだ'
    : e.converted.includes(id) ? 'あなたのおかげで、狼をやめた' : esc(C[id].fate);
  return `<div class="wrap"><section class="end">
    <div class="kicker">${e.kicker}</div><h1>${esc(e.title)}</h1>
    <div class="window"><span class="tag">${dateLabel(LAST_DAY)}</span><div class="lines">${linesHTML(e.lines)}</div></div>
    <div class="reveal"><h3>答え合わせ</h3>
      <p>${guessLine}</p>
      ${wolfListHTML(fate)}
      ${e.metWolves.length > e.converted.length ? `<p class="empty">もっと距離を縮めていたら、狼の心も変えられたかもしれません。</p>` : ''}
    </div>
    <div class="reveal"><h3>好感度</h3>${tallyHTML()}</div>
    <div class="row"><button class="btn-main" data-go="restart">もう一度あそぶ</button><button class="btn-sub" data-go="toTitle">タイトルへ</button></div>
  </section>${noteHTML()}</div>`;
}

const app = document.getElementById('app');
function render() {
  if (!S) app.innerHTML = titleHTML();
  else if (S.screen === 'swipe') { app.innerHTML = swipeHTML(); bindSwipe(); }
  else if (S.screen === 'over') app.innerHTML = overHTML();
  else if (S.screen === 'ending') app.innerHTML = endingHTML();
  else {
    app.innerHTML = playHTML();
    const st = document.getElementById('story');
    if (st) st.scrollTop = st.scrollHeight;
  }
}
function advance(all) {
  if (!S || S.screen !== 'play' || S.shown >= S.log.length) return;
  S.shown = all ? S.log.length : S.shown + 1;
  render();
}

/* ---------- swipe gesture ---------- */
let flying = false;
function fly(yes) {
  if (flying) return;
  const card = document.getElementById('swcard');
  if (!card || reduceMotion()) { ACT.swipe(yes); return; }
  flying = true;
  card.style.transition = 'transform .24s ease, opacity .24s ease';
  card.style.setProperty(yes ? '--yes' : '--no', 1);
  card.style.transform = `translateX(${yes ? 520 : -520}px) rotate(${yes ? 18 : -18}deg)`;
  card.style.opacity = '0';
  setTimeout(() => { flying = false; ACT.swipe(yes); }, 220);
}
function bindSwipe() {
  const card = document.getElementById('swcard');
  if (!card) return;
  let x0 = null, dx = 0;
  card.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
  card.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    card.style.setProperty('--yes', Math.max(0, Math.min(1, dx / 90)));
    card.style.setProperty('--no', Math.max(0, Math.min(1, -dx / 90)));
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null; card.style.transition = '';
    if (dx > 90) fly(true); else if (dx < -90) fly(false);
    else { card.style.transform = ''; card.style.setProperty('--yes', 0); card.style.setProperty('--no', 0); }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

app.addEventListener('submit', e => {
  if (e.target.id !== 'startForm') return;
  e.preventDefault();
  newGame(document.getElementById('pname').value.trim().slice(0, 8));
  window.scrollTo({ top: 0 });
});
app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) { if (e.target.closest('#story')) advance(false); return; }
  if (b.dataset.adv) { advance(b.dataset.adv === 'all'); return; }
  if (b.dataset.go) { ACT[b.dataset.go](); window.scrollTo({ top: 0 }); return; }
  if (b.dataset.sw !== undefined) { if (b.dataset.sw === 'close') ACT.closeSwipe(); else fly(b.dataset.sw === '1'); return; }
  if (b.dataset.i !== undefined && S && S.scene) {
    const c = S.scene.choices[+b.dataset.i];
    if (c && !c.disabled) {
      if (c.me) { S.log.push(['me', c.me]); S.meFlag = true; }
      ACT[c.act](c.arg);
    }
  }
});
document.addEventListener('keydown', e => {
  if (S && S.screen === 'play' && (e.key === 'Enter' || e.key === ' ') && !e.target.closest('button,input,summary')) { e.preventDefault(); advance(false); return; }
  if (!S || S.screen !== 'swipe') return;
  if (e.key === 'ArrowRight') fly(true);
  if (e.key === 'ArrowLeft') fly(false);
});

registerCast();
buildPortraits();
window.claude?.hot?.snapshot?.(() => ({ S }));
const boot = d => { if (d && d.S && d.S.v === 9) S = d.S; render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
